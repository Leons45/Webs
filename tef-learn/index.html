<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Écrire — TEF Writing Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #FFFCF4;
  --ink:     #16121F;
  --soft:    #6D6480;
  --hair:    #E3DCCD;
  --jaune:   #FFC400;
  --rose:    #FF3D8B;
  --orange:  #FF6B2C;
  --violet:  #7B5BD6;
  --vert:    #007A42;
  --bleu:    #0A6CF0;
  --sarcelle:#00968F;
  --r: 10px;
  --pop: 3px 3px 0 var(--ink);
  --ff-display: 'Fraunces', Georgia, serif;
  --ff-ui: 'DM Sans', system-ui, sans-serif;
  --accent: var(--violet);
  --accent-wash: #E9E2FB;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ff-ui);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── header ─────────────────────────────────── */
.header {
  padding: 18px 20px 14px;
  border-bottom: 1.5px solid var(--hair);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 10;
}
.wordmark {
  font-family: var(--ff-display);
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}
.wordmark span { color: var(--accent); }

/* ── section toggle ──────────────────────────── */
.section-toggle {
  display: flex;
  gap: 4px;
  background: var(--hair);
  border-radius: 8px;
  padding: 3px;
}
.section-toggle button {
  font-family: var(--ff-ui);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  border: none;
  background: transparent;
  color: var(--soft);
  padding: 5px 11px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.section-toggle button.active {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}

/* ── progress bar ─────────────────────────────── */
.progress-bar {
  height: 3px;
  background: var(--hair);
  position: relative;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width .3s ease;
}

/* ── topic pills ─────────────────────────────── */
.topics-scroller {
  padding: 14px 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1.5px solid var(--hair);
}
.topics-scroller::-webkit-scrollbar { display: none; }
.topics-row {
  display: flex;
  gap: 7px;
  width: max-content;
}
.topic-pill {
  font-family: var(--ff-ui);
  font-size: 0.8rem;
  font-weight: 600;
  border: 2px solid transparent;
  padding: 5px 13px;
  border-radius: 100px;
  cursor: pointer;
  background: transparent;
  color: var(--ink);
  border-color: var(--hair);
  transition: border-color .15s, background .15s, color .15s, box-shadow .12s;
  white-space: nowrap;
}
.topic-pill:hover { border-color: var(--ink); }
.topic-pill.active {
  background: var(--topic-color, var(--accent));
  border-color: var(--topic-color, var(--accent));
  color: white;
  box-shadow: var(--pop);
}
.topic-pill.active.light { color: var(--ink); }

/* ── counter ─────────────────────────────────── */
.counter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px 0;
}
.counter-label {
  font-size: 0.75rem;
  color: var(--soft);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.known-count {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--vert);
}

/* ── card area ───────────────────────────────── */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 20px;
  gap: 14px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--r);
  box-shadow: var(--pop);
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  transition: transform .12s var(--spring, ease), box-shadow .12s;
  --spring: cubic-bezier(.2,1.5,.35,1);
  position: relative;
}
.card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.card-accent {
  height: 5px;
  background: var(--topic-color, var(--accent));
}
.card-body {
  padding: 24px 24px 20px;
}

/* French phrase — the star */
.card-fr {
  font-family: var(--ff-display);
  font-size: clamp(1.3rem, 4vw, 1.75rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 10px;
}

/* English always visible */
.card-en {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--soft);
  line-height: 1.4;
  margin-bottom: 0;
}

/* Example — tap to reveal */
.card-example {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1.5px solid var(--hair);
  display: none;
}
.card-example.open { display: block; }

.example-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--topic-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: 7px;
}
.example-fr {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 0.95rem;
  line-height: 1.55;
  color: var(--ink);
  margin-bottom: 6px;
}
.example-en {
  font-size: 0.82rem;
  color: var(--soft);
  line-height: 1.5;
}

/* Tap hint */
.tap-hint {
  position: absolute;
  bottom: 10px;
  right: 14px;
  font-size: 0.65rem;
  color: var(--hair);
  font-weight: 500;
  transition: color .2s;
}
.card:hover .tap-hint { color: var(--soft); }

/* ── known badge ─────────────────────────────── */
.known-badge {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--vert);
  display: none;
  align-items: center;
  justify-content: center;
}
.known-badge.show { display: flex; }
.known-badge svg { width: 12px; height: 12px; fill: none; stroke: white; stroke-width: 2.5; }

/* ── nav controls ────────────────────────────── */
.nav-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 520px;
}
.nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--pop);
  transition: transform .1s, box-shadow .1s;
  flex-shrink: 0;
}
.nav-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.nav-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
.nav-btn svg { width: 16px; height: 16px; }

.know-btn {
  flex: 1;
  height: 44px;
  border-radius: 100px;
  border: 2px solid var(--ink);
  font-family: var(--ff-ui);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: var(--pop);
  transition: transform .1s, box-shadow .1s, background .15s, color .15s;
  background: var(--paper);
  color: var(--ink);
}
.know-btn.known {
  background: var(--vert);
  color: white;
  border-color: var(--vert);
}
.know-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.know-btn svg { width: 14px; height: 14px; }

/* ── dot nav ─────────────────────────────────── */
.dot-nav {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  max-width: 520px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--hair);
  cursor: pointer;
  transition: background .2s, transform .15s;
}
.dot.current { background: var(--ink); transform: scale(1.3); }
.dot.known-dot { background: var(--vert); }

/* ── empty state ─────────────────────────────── */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--soft);
  font-size: 0.9rem;
  text-align: center;
  padding: 40px 20px;
}
.empty .big { font-size: 2.5rem; }

/* ── keyboard shortcut hint ──────────────────── */
.shortcuts {
  text-align: center;
  font-size: 0.7rem;
  color: var(--hair);
  padding: 0 20px 16px;
  letter-spacing: 0.01em;
}

/* ── animate card in ─────────────────────────── */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideInBack {
  from { opacity: 0; transform: translateX(-28px); }
  to   { opacity: 1; transform: translateX(0); }
}
.card.anim-in       { animation: slideIn .22s ease forwards; }
.card.anim-in-back  { animation: slideInBack .22s ease forwards; }

@media (prefers-reduced-motion: reduce) {
  .card.anim-in, .card.anim-in-back { animation: none; }
}
</style>
</head>

/* ═══════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════ */
let section = 'A';
let topicIdx = 0;
let cardIdx  = 0;
let known    = {}; // key = `${topicId}_${itemIdx}` → true
let expanded = false;

try { known = JSON.parse(localStorage.getItem('ecrire_known') || '{}'); } catch(e){}

function saveKnown() {
  try { localStorage.setItem('ecrire_known', JSON.stringify(known)); } catch(e){}
}

function currentTopics() { return TOPICS[section]; }
function currentTopic()  { return currentTopics()[topicIdx]; }
function currentItems()  { return currentTopic().items; }
function currentItem()   { return currentItems()[cardIdx]; }
function knownKey(ti, ci) { return `${currentTopics()[ti].id}_${ci}`; }
function isKnown(ti, ci) { return !!known[knownKey(ti, ci)]; }

/* ═══════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════ */
function renderTopics() {
  const row = document.getElementById('topicsRow');
  row.innerHTML = '';
  currentTopics().forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-pill' + (i === topicIdx ? ' active' : '') + (t.light ? ' light' : '');
    btn.style.setProperty('--topic-color', t.color);
    btn.textContent = t.fr;
    btn.onclick = () => { topicIdx = i; cardIdx = 0; expanded = false; renderAll(); };
    row.appendChild(btn);
  });
}

function renderCard(direction) {
  const area = document.getElementById('cardArea');
  const item = currentItem();
  const topic = currentTopic();
  const items = currentItems();
  const ki = knownKey(topicIdx, cardIdx);
  const isKn = !!known[ki];

  // progress fill
  const knownInTopic = items.filter((_, ci) => isKnown(topicIdx, ci)).length;
  document.getElementById('progressFill').style.width = (knownInTopic / items.length * 100) + '%';
  document.getElementById('counterLabel').textContent = `${cardIdx + 1} / ${items.length}`;
  const kc = document.getElementById('knownCount');
  kc.textContent = knownInTopic > 0 ? `${knownInTopic} known ✓` : '';

  area.innerHTML = `
    <div class="card${direction ? ' anim-in' + (direction === 'back' ? '-back' : '') : ''}"
         style="--topic-color:${topic.color}"
         onclick="toggleExpand()">
      <div class="card-accent"></div>
      <div class="card-body">
        <div class="known-badge${isKn ? ' show' : ''}">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1"/></svg>
        </div>
        <div class="card-fr">${item.fr}</div>
        <div class="card-en">${item.en}</div>
        <div class="card-example${expanded ? ' open' : ''}">
          <div class="example-label">Exemple</div>
          <div class="example-fr">${item.ex}</div>
          <div class="example-en">${item.exEn}</div>
        </div>
      </div>
      <div class="tap-hint">${expanded ? '▲ tap to close' : '▼ tap for example'}</div>
    </div>

    <div class="nav-controls" style="--topic-color:${topic.color}">
      <button class="nav-btn" onclick="navigate(-1)" ${cardIdx === 0 ? 'disabled' : ''} aria-label="Previous">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="10,3 5,8 10,13"/></svg>
      </button>
      <button class="know-btn${isKn ? ' known' : ''}" onclick="toggleKnown()">
        <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="1,6 5,10 13,2"/>
        </svg>
        ${isKn ? 'Marked known' : 'Mark as known'}
      </button>
      <button class="nav-btn" onclick="navigate(1)" ${cardIdx === items.length - 1 ? 'disabled' : ''} aria-label="Next">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,3 11,8 6,13"/></svg>
      </button>
    </div>

    <div class="dot-nav">
      ${items.map((_, i) => {
        const kn = isKnown(topicIdx, i);
        return `<div class="dot${i === cardIdx ? ' current' : ''}${kn ? ' known-dot' : ''}"
                     onclick="jumpTo(${i})"></div>`;
      }).join('')}
    </div>
  `;
}

function renderAll(direction) {
  renderTopics();
  renderCard(direction);
  // accent color on header
  document.documentElement.style.setProperty('--accent', currentTopic().color);
  // section buttons
  document.getElementById('btnA').classList.toggle('active', section === 'A');
  document.getElementById('btnB').classList.toggle('active', section === 'B');
}

/* ═══════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════ */
function setSection(s) {
  section = s; topicIdx = 0; cardIdx = 0; expanded = false;
  renderAll();
}

function navigate(dir) {
  const items = currentItems();
  const next = cardIdx + dir;
  if (next < 0 || next >= items.length) return;
  cardIdx = next;
  expanded = false;
  renderAll(dir === 1 ? 'fwd' : 'back');
}

function jumpTo(i) {
  cardIdx = i; expanded = false;
  renderAll();
}

function toggleKnown() {
  const ki = knownKey(topicIdx, cardIdx);
  if (known[ki]) { delete known[ki]; } else { known[ki] = true; }
  saveKnown();
  renderCard();
  // auto-advance if marking known and not at end
  if (known[ki] && cardIdx < currentItems().length - 1) {
    setTimeout(() => { cardIdx++; expanded = false; renderAll('fwd'); }, 400);
  }
}

function toggleExpand() {
  expanded = !expanded;
  renderCard();
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === ' ')          { e.preventDefault(); toggleKnown(); }
  if (e.key === 'e' || e.key === 'E') toggleExpand();
});

/* ═══════════════════════════════════════════════════════
   TOUCH SWIPE
   ═══════════════════════════════════════════════════════ */
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
}, { passive: true });

/* ── boot ── */
renderAll();
</script>
