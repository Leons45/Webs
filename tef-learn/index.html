    {t:'v',fr:'débrouillard(e)',wc:'adj',en:'resourceful / good at finding solutions',ex:'Cette fillette de huit ans s\'est révélée particulièrement débrouillarde.',exE:'This eight-year-old girl proved to be particularly resourceful.'},
    {t:'v',fr:'tomber à l\'eau',wc:'loc',en:'to fall into the water',ex:'Le petit garçon est tombé à l\'eau sans que personne ne le voie.',exE:'The little boy fell into the water without anyone seeing.'},
    {t:'v',fr:'faire preuve de + nom',wc:'loc',en:'to show / demonstrate (quality)',ex:'Il a fait preuve d\'un courage et d\'un calme remarquables.',exE:'He showed remarkable courage and composure.'},
    {t:'v',fr:'téméraire',wc:'adj',en:'daring / reckless / bold',ex:'Son geste téméraire a permis d\'éviter une catastrophe.',exE:'His daring action helped avoid a catastrophe.'},
    {t:'v',fr:'une bêtise',wc:'nf',en:'mischief / a silly thing to do',ex:'Les écoliers ont fait une bêtise en creusant dans le jardin du voisin.',exE:'The schoolchildren got into mischief digging in the neighbour\'s garden.'},
    {t:'v',fr:'incroyable mais vrai',wc:'loc',en:'unbelievable but true',ex:'Incroyable mais vrai, l\'enfant de sept ans a réussi à conduire le bus scolaire.',exE:'Unbelievable but true, the seven-year-old managed to drive the school bus.'},
    {t:'v',fr:'se distinguer',wc:'v',en:'to distinguish oneself / stand out',ex:'Ce jeune garçon s\'est distingué par son acte héroïque.',exE:'This young boy distinguished himself through his heroic act.'},
    {t:'v',fr:'les secours / les services d\'urgence',wc:'nmpl',en:'emergency services / rescue services',ex:'Les secours sont intervenus très rapidement après l\'accident.',exE:'Emergency services intervened very quickly after the accident.'},
  
    {t:'p',fr:'avoir l\'air + adj',en:'to seem / look (adjective)',ex:'L\'enfant avait l\'air inquiet depuis le début de la journée.',exE:'The child looked worried from the start of the day.'},
    {t:'p',fr:'tout(e) seul(e) / sans aide',en:'all alone / without help',ex:'Walid a réussi à arrêter le bus tout seul, sans aide d\'un adulte.',exE:'Walid managed to stop the bus all by himself, without help from an adult.'},
    {t:'p',fr:'être fier / fière de quelqu\'un',en:'to be proud of someone',ex:'Ses parents étaient tellement fiers de ce qu\'il avait accompli.',exE:'His parents were so proud of what he had accomplished.'},
    {t:'p',fr:'ne pas réfléchir avant d\'agir',en:'to act without thinking',ex:'Il n\'a pas réfléchi avant d\'agir — c\'est instinctif chez lui.',exE:'He didn\'t think before acting — it comes instinctively to him.'},
    {t:'p',fr:'tout le monde était admiratif',en:'everyone was full of admiration',ex:'Après la nouvelle, tout le monde était admiratif devant son geste.',exE:'After the news broke, everyone was full of admiration for his act.'},
    {t:'p',fr:'en parler à ses parents',en:'to tell one\'s parents about it',ex:'Il n\'a pas eu peur d\'en parler à ses parents dès son retour.',exE:'He wasn\'t afraid to tell his parents about it as soon as he got home.'},
    {t:'v',fr:'bravo / félicitations',wc:'interj',en:'well done / congratulations',ex:'Bravo ! Tu as réussi à faire quelque chose qu\'un adulte n\'aurait pas osé faire.',exE:'Well done! You managed to do something that an adult wouldn\'t have dared to do.'},
    {t:'v',fr:'un geste héroïque',wc:'nm',en:'a heroic act / gesture',ex:'Son geste héroïque a été salué par toute la ville.',exE:'His heroic act was praised by the entire town.'},
    {t:'v',fr:'avoir peur / prendre peur',wc:'loc',en:'to be scared / get frightened',ex:'Malgré la situation, il n\'a pas pris peur et a gardé la tête froide.',exE:'Despite the situation, he didn\'t get frightened and kept a cool head.'},
    {t:'v',fr:'réagir vite / rapidement',wc:'loc',en:'to react quickly',ex:'Il a fallu réagir très vite pour éviter un accident.',exE:'It was necessary to react very quickly to avoid an accident.'},
    {t:'v',fr:'incroyable / remarquable',wc:'adj',en:'incredible / remarkable',ex:'La réaction de cet enfant était vraiment incroyable pour son âge.',exE:'This child\'s reaction was truly incredible for his age.'},
    {t:'v',fr:'un enfant de + âge',wc:'loc',en:'a child of (age)',ex:'Un enfant de sept ans a réussi à conduire le bus scolaire.',exE:'A seven-year-old child managed to drive the school bus.'},
    {t:'v',fr:'sauver la mise',wc:'loc',en:'to save the day / save the situation',ex:'Grâce à son intervention, il a sauvé la mise pour tout le groupe.',exE:'Thanks to his intervention, he saved the day for the whole group.'},
]},

  {id:'famille',fr:'Famille',en:'Family & couples',c:'#FFC400',l:true,items:[
    {t:'p',fr:'cacher une vérité à quelqu\'un depuis des années',en:'to hide a truth from someone for years',ex:'Elle a découvert que son mari lui cachait une vérité depuis plus de trente ans.',exE:'She discovered her husband had been hiding a truth from her for more than thirty years.'},
    {t:'p',fr:'prendre une décision qui va tout changer',en:'to make a decision that will change everything',ex:'Ce jour-là, elle a pris une décision qui allait changer leur vie pour toujours.',exE:'That day, she made a decision that would change their lives forever.'},
    {t:'p',fr:'malgré les apparences,…',en:'despite appearances,…',ex:'Malgré les apparences, leur relation était bien plus fragile qu\'ils ne le montraient.',exE:'Despite appearances, their relationship was far more fragile than they showed.'},
    {t:'p',fr:'fêter leur Nième anniversaire de mariage',en:'to celebrate their Nth wedding anniversary',ex:'Ils fêtaient leur vingtième anniversaire de mariage au bord de la mer.',exE:'They were celebrating their twentieth wedding anniversary by the sea.'},
    {t:'p',fr:'garder un secret pendant des décennies',en:'to keep a secret for decades',ex:'Ce couple discret avait gardé un secret extraordinaire pendant soixante ans.',exE:'This discreet couple had kept an extraordinary secret for sixty years.'},
    {t:'p',fr:'se réconcilier après une brouille',en:'to make up after a falling-out',ex:'Après des années de silence, les deux frères ont fini par se réconcilier.',exE:'After years of silence, the two brothers finally made up.'},
    {t:'p',fr:'se confier à quelqu\'un',en:'to confide in someone / open up to someone',ex:'Elle n\'avait jamais osé se confier à quiconque avant ce soir-là.',exE:'She had never dared confide in anyone before that evening.'},
    {t:'p',fr:'remettre en question leur relation',en:'to call their relationship into question',ex:'Cette découverte a remis en question toute leur relation.',exE:'This discovery called their entire relationship into question.'},
    {t:'v',fr:'une grande complicité',wc:'nf',en:'a close, easy bond / strong rapport',ex:'La grand-mère et sa petite-fille vivaient dans une grande complicité.',exE:'The grandmother and granddaughter lived in a close, easy bond.'},
    {t:'v',fr:'protecteur / protectrice',wc:'adj',en:'protective',ex:'La petite-fille était très protectrice envers sa grand-mère âgée.',exE:'The granddaughter was very protective of her elderly grandmother.'},
    {t:'v',fr:'se venger discrètement',wc:'loc',en:'to take quiet revenge',ex:'Elle a décidé de se venger discrètement, sans rien laisser paraître.',exE:'She decided to take quiet revenge, without letting anything show.'},
    {t:'v',fr:'capricieux / capricieuse',wc:'adj',en:'unpredictable / capricious',ex:'La météo est devenue capricieuse en plein après-midi.',exE:'The weather turned unpredictable in the middle of the afternoon.'},
    {t:'v',fr:'prendre sa liberté',wc:'loc',en:'to claim one\'s independence',ex:'Un jour, la grand-mère de 80 ans a décidé de prendre sa liberté.',exE:'One day, the 80-year-old grandmother decided to claim her independence.'},
    {t:'v',fr:'une brouille',wc:'nf',en:'a falling-out / a quarrel',ex:'Une simple brouille s\'est transformée en dispute qui a duré dix ans.',exE:'A simple falling-out turned into a dispute that lasted ten years.'},
    {t:'v',fr:'un malentendu',wc:'nm',en:'a misunderstanding',ex:'Tout était parti d\'un malentendu qui aurait pu être évité.',exE:'It all started from a misunderstanding that could have been avoided.'},
    {t:'v',fr:'dévoiler / révéler un secret',wc:'v',en:'to reveal / unveil a secret',ex:'Ce jour-là, ils ont enfin révélé le secret qu\'ils gardaient depuis soixante ans.',exE:'That day, they finally revealed the secret they had kept for sixty years.'},
    {t:'v',fr:'se méfier de',wc:'v',en:'to be wary of / distrust',ex:'Depuis cette trahison, elle ne pouvait plus s\'empêcher de se méfier de lui.',exE:'Since that betrayal, she could not help but be wary of him.'},
    {t:'v',fr:'soupçonner quelqu\'un',wc:'v',en:'to suspect someone',ex:'Elle avait longtemps soupçonné que son mari lui cachait quelque chose.',exE:'She had long suspected that her husband was hiding something from her.'},
    {t:'v',fr:'une rupture / une séparation',wc:'nf',en:'a break-up / separation',ex:'Après cette révélation, une rupture semblait inévitable.',exE:'After this revelation, a break-up seemed inevitable.'},
    {t:'v',fr:'pardonner / ne pas pardonner',wc:'v',en:'to forgive / not forgive',ex:'Contre toute attente, elle a choisi de tout pardonner.',exE:'Against all expectations, she chose to forgive everything.'},
  
    {t:'p',fr:'s\'entendre bien / mal avec quelqu\'un',en:'to get along well / badly with someone',ex:'Depuis toujours, elle s\'entendait très bien avec sa grand-mère.',exE:'She had always got along very well with her grandmother.'},
    {t:'p',fr:'tenir à quelqu\'un / quelque chose',en:'to care about someone / something',ex:'Il tenait beaucoup à cette montre que son père lui avait offerte.',exE:'He really cared about this watch that his father had given him.'},
    {t:'p',fr:'avoir du mal à pardonner',en:'to have difficulty forgiving',ex:'Après cette trahison, elle avait du mal à lui pardonner.',exE:'After this betrayal, she had difficulty forgiving him.'},
    {t:'p',fr:'ne plus se parler depuis…',en:'to no longer speak to each other since…',ex:'Les deux sœurs ne se parlaient plus depuis leur dispute l\'année dernière.',exE:'The two sisters had not spoken to each other since their argument last year.'},
    {t:'p',fr:'tout recommencer de zéro',en:'to start everything from scratch again',ex:'Après leur séparation, elle a décidé de tout recommencer de zéro.',exE:'After their separation, she decided to start everything from scratch again.'},
    {t:'p',fr:'manquer à quelqu\'un',en:'to be missed by someone / to miss (French structure)',ex:'Tu me manques beaucoup depuis que tu es parti vivre à l\'étranger.',exE:'I miss you a lot since you went to live abroad.'},
    {t:'v',fr:'les liens familiaux',wc:'nm pl',en:'family bonds / ties',ex:'Elle accordait une grande importance aux liens familiaux.',exE:'She placed great importance on family bonds.'},
    {t:'v',fr:'élever ses enfants',wc:'v',en:'to raise one\'s children',ex:'Elle a élevé ses trois enfants seule après leur séparation.',exE:'She raised her three children alone after their separation.'},
    {t:'v',fr:'une dispute / se disputer',wc:'nf/v',en:'an argument / to argue',ex:'Une dispute ridicule a failli détruire leur amitié de vingt ans.',exE:'A ridiculous argument almost destroyed their twenty-year friendship.'},
    {t:'v',fr:'proche de quelqu\'un',wc:'adj',en:'close to someone',ex:'Elle était très proche de sa cousine pendant l\'enfance.',exE:'She was very close to her cousin during childhood.'},
    {t:'v',fr:'s\'en vouloir de + inf',wc:'loc',en:'to blame oneself for doing something',ex:'Il s\'en voulait de ne pas avoir appelé sa mère plus souvent.',exE:'He blamed himself for not calling his mother more often.'},
    {t:'v',fr:'avoir besoin de soutien',wc:'loc',en:'to need support',ex:'Dans les moments difficiles, elle avait besoin du soutien de sa famille.',exE:'In difficult times, she needed the support of her family.'},
    {t:'v',fr:'s\'occuper de',wc:'v',en:'to take care of / look after',ex:'La fille aînée s\'occupait de ses parents depuis leur retraite.',exE:'The eldest daughter had been looking after her parents since their retirement.'},
]},

  {id:'police',fr:'Police',en:'Police & mystery',c:'#0A6CF0',l:false,items:[
    {t:'p',fr:'ouvrir / mener une enquête',en:'to open / conduct an investigation',ex:'Une enquête a été ouverte après la découverte des 24 000 lettres non remises.',exE:'An investigation was opened after the discovery of the 24,000 undelivered letters.'},
    {t:'p',fr:'être retrouvé(e) coincé(e) à l\'intérieur',en:'to be found trapped inside',ex:'L\'homme a été retrouvé coincé à l\'intérieur du magasin fermé le matin de Noël.',exE:'The man was found trapped inside the closed shop on Christmas morning.'},
    {t:'p',fr:'rouler à toute vitesse / à tombeau ouvert',en:'to drive at full speed / at breakneck speed',ex:'Le motard roulait à tombeau ouvert, une seule main sur le guidon.',exE:'The biker was riding at breakneck speed, with one hand on the handlebars.'},
    {t:'p',fr:'sans se douter que…',en:'without suspecting that…',ex:'Elle est partie sans se douter que quelqu\'un l\'avait vue.',exE:'She left without suspecting that someone had seen her.'},
    {t:'p',fr:'quelle surprise quand…',en:'what a surprise when…',ex:'Quelle surprise quand la police a finalement découvert le coupable !',exE:'What a surprise when the police finally discovered the culprit!'},
    {t:'p',fr:'être placé(e) en garde à vue',en:'to be taken into police custody',ex:'Le suspect a été placé en garde à vue pendant 48 heures.',exE:'The suspect was taken into police custody for 48 hours.'},
    {t:'p',fr:'reconnaître quelqu\'un / quelque chose',en:'to recognise someone / something',ex:'Un témoin a reconnu le vélo volé dès le lendemain matin.',exE:'A witness recognised the stolen bike the very next morning.'},
    {t:'p',fr:'être pris(e) en flagrant délit',en:'to be caught red-handed',ex:'Le voleur a finalement été pris en flagrant délit devant la bijouterie.',exE:'The thief was finally caught red-handed outside the jewellery shop.'},
    {t:'v',fr:'interpeller / appréhender',wc:'v',en:'to apprehend / detain a suspect',ex:'La police a fini par interpeller le coupable grâce à un témoin.',exE:'The police eventually apprehended the culprit thanks to a witness.'},
    {t:'v',fr:'un témoin oculaire',wc:'nm',en:'an eyewitness',ex:'Les enquêteurs ont recueilli les témoignages de plusieurs témoins oculaires.',exE:'The investigators gathered statements from several eyewitnesses.'},
    {t:'v',fr:'dérober / voler',wc:'v',en:'to steal / rob',ex:'Son vélo avait été dérobé devant la bibliothèque.',exE:'His bicycle had been stolen in front of the library.'},
    {t:'v',fr:'une perquisition',wc:'nf',en:'a police search / raid',ex:'La police a effectué une perquisition dans l\'appartement du suspect.',exE:'The police carried out a search of the suspect\'s apartment.'},
    {t:'v',fr:'inculper / mettre en examen',wc:'v',en:'to charge (with an offence)',ex:'Le suspect a finalement été inculpé pour vol avec effraction.',exE:'The suspect was finally charged with breaking and entering.'},
    {t:'v',fr:'une filature',wc:'nf',en:'a stakeout / surveillance tail',ex:'Les policiers ont effectué une longue filature avant d\'arrêter le suspect.',exE:'The police officers carried out a long stakeout before arresting the suspect.'},
    {t:'v',fr:'le guidon',wc:'nm',en:'the handlebars (bike/motorbike)',ex:'Il tenait une tasse de café dans une main et son guidon de l\'autre.',exE:'He held a coffee cup in one hand and his handlebars in the other.'},
    {t:'v',fr:'élucider une affaire',wc:'v',en:'to solve a case / clear up a matter',ex:'Grâce à un coup de chance, les enquêteurs ont pu élucider l\'affaire.',exE:'Thanks to a stroke of luck, the investigators managed to solve the case.'},
    {t:'v',fr:'un coup de chance / de théâtre',wc:'nm',en:'a stroke of luck / a dramatic twist',ex:'L\'affaire a connu un coup de théâtre inattendu lors du procès.',exE:'The case had an unexpected dramatic twist during the trial.'},
    {t:'v',fr:'déposer une plainte',wc:'loc',en:'to file a complaint',ex:'La victime a déposé une plainte auprès du commissariat de quartier.',exE:'The victim filed a complaint at the local police station.'},
    {t:'v',fr:'un mobile',wc:'nm',en:'a motive (crime)',ex:'La police n\'avait toujours pas trouvé le mobile du crime.',exE:'The police still had not found the motive for the crime.'},
    {t:'v',fr:'soupçonner quelqu\'un',wc:'v',en:'to suspect someone',ex:'Les enquêteurs soupçonnaient depuis longtemps le voisin.',exE:'The investigators had long suspected the neighbour.'},
  
    {t:'p',fr:'appeler la police / composer le 17',en:'to call the police / dial 17',ex:'Un passant a composé le 17 après avoir vu quelque chose de suspect.',exE:'A passer-by dialled 17 after seeing something suspicious.'},
    {t:'p',fr:'donner une description de quelqu\'un',en:'to give a description of someone',ex:'Le témoin a pu donner une description précise du suspect aux policiers.',exE:'The witness was able to give a precise description of the suspect to the police.'},
    {t:'p',fr:'être au mauvais endroit au mauvais moment',en:'to be in the wrong place at the wrong time',ex:'Malheureusement, il s\'était trouvé au mauvais endroit au mauvais moment.',exE:'Unfortunately, he had found himself in the wrong place at the wrong time.'},
    {t:'p',fr:'ne pas avoir vu venir la chose',en:'to not have seen it coming',ex:'Personne n\'avait vu venir une telle escroquerie dans ce quartier calme.',exE:'Nobody had seen such a scam coming in this quiet neighbourhood.'},
    {t:'p',fr:'reconnaître ses torts',en:'to admit one\'s faults / acknowledge wrongdoing',ex:'Finalement, le suspect a reconnu ses torts devant les enquêteurs.',exE:'In the end, the suspect acknowledged his wrongdoing before the investigators.'},
    {t:'p',fr:'rester calme / ne pas paniquer',en:'to stay calm / not to panic',ex:'Face au danger, il a su rester calme et ne pas paniquer.',exE:'Faced with danger, he managed to stay calm and not panic.'},
    {t:'v',fr:'un suspect / une suspecte',wc:'nm/f',en:'a suspect',ex:'La police recherchait un suspect aperçu près de la scène du crime.',exE:'The police were looking for a suspect spotted near the crime scene.'},
    {t:'v',fr:'un voleur / une voleuse',wc:'nm/f',en:'a thief',ex:'Le voleur avait opéré en pleine nuit sans laisser de traces.',exE:'The thief had operated in the dead of night without leaving any traces.'},
    {t:'v',fr:'s\'enfuir / prendre la fuite',wc:'v',en:'to flee / to run away',ex:'Le suspect a tenté de s\'enfuir mais a été rattrapé par la police.',exE:'The suspect tried to flee but was caught by the police.'},
    {t:'v',fr:'un vol / un cambriolage',wc:'nm',en:'a theft / burglary',ex:'Un cambriolage avait eu lieu dans le quartier la semaine précédente.',exE:'A burglary had taken place in the neighbourhood the previous week.'},
    {t:'v',fr:'en sécurité / à l\'abri',wc:'adj',en:'safe / sheltered',ex:'Les habitants ne se sentaient plus en sécurité après l\'incident.',exE:'The residents no longer felt safe after the incident.'},
    {t:'v',fr:'les forces de l\'ordre',wc:'nfpl',en:'law enforcement / the police',ex:'Les forces de l\'ordre ont réagi très rapidement à l\'appel.',exE:'Law enforcement responded very quickly to the call.'},
    {t:'v',fr:'une scène de crime / les lieux',wc:'nf',en:'a crime scene / the scene',ex:'Les enquêteurs ont sécurisé la scène de crime avant d\'investiguer.',exE:'The investigators secured the crime scene before investigating.'},
]},

  {id:'voyage',fr:'Voyages',en:'Travel & adventure',c:'#00968F',l:false,items:[
    {t:'p',fr:'se rendre quelque part pour la première fois de sa vie',en:'to go somewhere for the first time in one\'s life',ex:'L\'homme de 80 ans se rendait en ville pour la première fois de sa vie.',exE:'The 80-year-old man was going into the city for the first time in his life.'},
    {t:'p',fr:'faire demi-tour en plein vol',en:'to turn back mid-flight',ex:'L\'avion a dû faire demi-tour en plein vol à cause d\'une passagère malade.',exE:'The plane had to turn back mid-flight because of a sick passenger.'},
    {t:'p',fr:'ne pas s\'attendre à ce que…',en:'to not expect / be in for a surprise',ex:'Les voisins ne s\'attendaient pas à une maison aussi moderne dans ce village.',exE:'The neighbours didn\'t expect such a modern house in that village.'},
    {t:'p',fr:'avoir l\'habitude de faire quelque chose',en:'to be in the habit of doing something',ex:'Il avait l\'habitude de photographier tous les monuments historiques qu\'il visitait.',exE:'He was in the habit of photographing all the historical monuments he visited.'},
    {t:'p',fr:'prendre la fuite sans demander son reste',en:'to flee without looking back',ex:'L\'homme a pris la fuite sans demander son reste quand la police est arrivée.',exE:'The man fled without looking back when the police arrived.'},
    {t:'p',fr:'être contraint(e) de faire demi-tour',en:'to be forced to turn back',ex:'Les randonneurs ont été contraints de faire demi-tour à cause des conditions météo.',exE:'The hikers were forced to turn back because of the weather conditions.'},
    {t:'p',fr:'s\'aventurer dans un endroit inconnu',en:'to venture into an unknown place',ex:'Elle s\'est aventurée seule dans les ruelles d\'une ville qu\'elle ne connaissait pas.',exE:'She ventured alone into the alleyways of a city she did not know.'},
    {t:'v',fr:'pittoresque',wc:'adj',en:'picturesque',ex:'L\'architecte a choisi de construire sa maison dans un village pittoresque.',exE:'The architect chose to build her house in a picturesque village.'},
    {t:'v',fr:'les autorités municipales',wc:'nfpl',en:'the local / municipal authorities',ex:'Les autorités municipales sont intervenues sans prévenir le propriétaire.',exE:'The municipal authorities stepped in without warning the owner.'},
    {t:'v',fr:'le décollage / l\'atterrissage',wc:'nm',en:'take-off / landing',ex:'L\'avion a eu un problème moteur juste après le décollage.',exE:'The plane had an engine problem right after take-off.'},
    {t:'v',fr:'une escale',wc:'nf',en:'a stopover / layover',ex:'Il avait prévu une escale de quelques heures à Paris avant de rejoindre Montréal.',exE:'He had planned a few-hour stopover in Paris before continuing to Montreal.'},
    {t:'v',fr:'le dépaysement',wc:'nm',en:'the feeling of being somewhere new / change of scenery',ex:'Elle avait besoin de dépaysement après plusieurs mois de travail intense.',exE:'She needed a change of scenery after several months of intense work.'},
    {t:'v',fr:'parcourir',wc:'v',en:'to travel through / cover (a distance)',ex:'Il a parcouru plus de cinq mille kilomètres en voiture pour ce voyage.',exE:'He covered more than five thousand kilometres by car for this journey.'},
    {t:'v',fr:'une correspondance',wc:'nf',en:'a connecting flight / train connection',ex:'Il a raté sa correspondance à cause d\'un retard imprévu.',exE:'He missed his connecting flight because of an unexpected delay.'},
    {t:'v',fr:'interrompre son voyage',wc:'loc',en:'to interrupt / cut short one\'s trip',ex:'Un problème médical l\'a obligé à interrompre son voyage.',exE:'A medical problem forced him to cut his trip short.'},
    {t:'v',fr:'un incident / un imprévu',wc:'nm',en:'an incident / unexpected event',ex:'Un imprévu de dernière minute a failli tout compromettre.',exE:'A last-minute unexpected event almost ruined everything.'},
    {t:'v',fr:'contraint(e) et forcé(e)',wc:'loc',en:'under duress / with no choice',ex:'Contraint et forcé, il a dû abandonner son projet de voyage.',exE:'With no other choice, he had to abandon his travel plan.'},
    {t:'v',fr:'interdit(e) d\'entrée',wc:'adj',en:'banned from entering / denied entry',ex:'Il a été interdit d\'entrée dans le monument pour des raisons de sécurité.',exE:'He was denied entry to the monument for security reasons.'},
  
    {t:'p',fr:'partir en voyage pour la première fois',en:'to go on a trip for the first time',ex:'C\'était la première fois qu\'elle partait seule en voyage à l\'étranger.',exE:'It was the first time she had gone on a trip abroad alone.'},
    {t:'p',fr:'avoir peur de / ne pas avoir l\'habitude de',en:'to be afraid of / not be used to',ex:'Au début, elle avait un peu peur de voyager seule, mais elle s\'y est vite habituée.',exE:'At first, she was a little afraid of travelling alone, but she quickly got used to it.'},
    {t:'p',fr:'se perdre dans une grande ville',en:'to get lost in a big city',ex:'Il s\'est perdu dans les ruelles d\'une vieille médina pendant plusieurs heures.',exE:'He got lost in the alleyways of an old medina for several hours.'},
    {t:'p',fr:'demander son chemin',en:'to ask for directions',ex:'Il a dû demander son chemin plusieurs fois avant de trouver l\'hôtel.',exE:'He had to ask for directions several times before finding the hotel.'},
    {t:'p',fr:'manquer son vol / son train',en:'to miss one\'s flight / train',ex:'À cause des embouteillages, elle a manqué son vol de deux minutes.',exE:'Because of traffic jams, she missed her flight by two minutes.'},
    {t:'p',fr:'arriver à destination sain(e) et sauf(ve)',en:'to arrive at the destination safe and sound',ex:'Après vingt heures de voyage, ils sont arrivés à destination sains et saufs.',exE:'After twenty hours of travel, they arrived at their destination safe and sound.'},
    {t:'v',fr:'les bagages / la valise',wc:'nm pl',en:'luggage / suitcase',ex:'Elle avait perdu ses bagages à l\'aéroport de transit.',exE:'She had lost her luggage at the transit airport.'},
    {t:'v',fr:'réserver / faire une réservation',wc:'v',en:'to book / make a reservation',ex:'Il avait réservé son billet de train trois semaines à l\'avance.',exE:'He had booked his train ticket three weeks in advance.'},
    {t:'v',fr:'un retard / être en retard',wc:'nm',en:'a delay / to be late',ex:'Un retard imprévu a compromis l\'ensemble du voyage.',exE:'An unexpected delay disrupted the entire trip.'},
    {t:'v',fr:'s\'adapter à la culture locale',wc:'loc',en:'to adapt to the local culture',ex:'Il a fallu du temps pour s\'adapter à la culture locale et aux habitudes du pays.',exE:'It took time to adapt to the local culture and the country\'s customs.'},
    {t:'v',fr:'un souvenir de voyage',wc:'nm',en:'a travel souvenir / memory',ex:'Elle avait rapporté de nombreux souvenirs de son séjour en Asie.',exE:'She had brought back many souvenirs from her stay in Asia.'},
    {t:'v',fr:'le mal du pays / la nostalgie',wc:'nm',en:'homesickness / nostalgia',ex:'Après trois mois à l\'étranger, le mal du pays s\'est fait sentir.',exE:'After three months abroad, homesickness set in.'},
    {t:'v',fr:'en voyage d\'affaires / pour le tourisme',wc:'loc',en:'on a business trip / for tourism',ex:'Il se trouvait à Lyon non pas pour le tourisme, mais en voyage d\'affaires.',exE:'He was in Lyon not for tourism, but on a business trip.'},
]},

  {id:'animaux',fr:'Animaux',en:'Animal stories',c:'#7B5BD6',l:false,items:[
    {t:'p',fr:'accueillir / adopter un animal abandonné',en:'to take in / adopt an abandoned animal',ex:'Le zoo a accueilli cinq perroquets abandonnés par leur propriétaire.',exE:'The zoo took in five parrots abandoned by their owner.'},
    {t:'p',fr:'se mettre à faire quelque chose de façon inattendue',en:'to unexpectedly start doing something',ex:'Les perroquets se sont mis à insulter les visiteurs pendant le spectacle.',exE:'The parrots suddenly started insulting the visitors during the show.'},
    {t:'p',fr:'provoquer un fou rire général',en:'to cause general fits of laughter',ex:'La scène a provoqué un fou rire général dans le public.',exE:'The scene caused general fits of laughter in the audience.'},
    {t:'p',fr:'être étonné(e) de voir',en:'to be astonished to see',ex:'Les pompiers étaient très étonnés de voir un tel animal dans cet endroit.',exE:'The firefighters were very astonished to see such an animal in that place.'},
    {t:'p',fr:'se retrouver face à un animal dangereux',en:'to come face to face with a dangerous animal',ex:'Le randonneur s\'est retrouvé face à un ours dans la forêt.',exE:'The hiker came face to face with a bear in the forest.'},
    {t:'p',fr:'nuire à la biodiversité',en:'to harm biodiversity',ex:'Ces espèces invasives nuisent gravement à la biodiversité locale.',exE:'These invasive species seriously harm local biodiversity.'},
    {t:'v',fr:'dresser / apprivoiser',wc:'v',en:'to train / tame',ex:'Personne ne savait que les perroquets avaient été dressés à parler ainsi.',exE:'No one knew the parrots had been trained to talk like that.'},
    {t:'v',fr:'un perroquet',wc:'nm',en:'a parrot',ex:'Les cinq perroquets ont été abandonnés par leur propriétaire.',exE:'The five parrots were abandoned by their owner.'},
    {t:'v',fr:'un enclos',wc:'nm',en:'an enclosure / pen',ex:'Le peintre célèbre a eu un accident dans l\'enclos des animaux.',exE:'The famous painter had an accident in the animal enclosure.'},
    {t:'v',fr:'une espèce menacée / protégée',wc:'nf',en:'an endangered / protected species',ex:'Le braconnier avait chassé des animaux appartenant à une espèce protégée.',exE:'The poacher had hunted animals belonging to a protected species.'},
    {t:'v',fr:'le braconnage / un braconnier',wc:'nm',en:'poaching / a poacher',ex:'Le braconnage reste un problème grave dans de nombreuses régions.',exE:'Poaching remains a serious problem in many regions.'},
    {t:'v',fr:'réintroduire une espèce',wc:'v',en:'to reintroduce a species',ex:'Des loups ont été réintroduits dans les Alpes après des décennies d\'absence.',exE:'Wolves were reintroduced in the Alps after decades of absence.'},
    {t:'v',fr:'la faune sauvage',wc:'nf',en:'wildlife / wild fauna',ex:'Il est essentiel de protéger la faune sauvage des régions nordiques.',exE:'It is essential to protect the wildlife of the northern regions.'},
    {t:'v',fr:'inoffensif / inoffensive',wc:'adj',en:'harmless',ex:'Contrairement aux apparences, cet animal est totalement inoffensif.',exE:'Despite appearances, this animal is completely harmless.'},
    {t:'v',fr:'un animal de compagnie',wc:'nm',en:'a pet',ex:'Les pompiers ont découvert un animal de compagnie un peu inhabituel.',exE:'The firefighters found a rather unusual pet.'},
    {t:'v',fr:'cohabiter avec',wc:'v',en:'to coexist / live alongside',ex:'Il est possible d\'apprendre à cohabiter avec les animaux sauvages.',exE:'It is possible to learn to coexist with wild animals.'},
    {t:'v',fr:'s\'échapper de son enclos',wc:'loc',en:'to escape from its enclosure',ex:'Un tigre s\'est échappé de son enclos pendant la nuit.',exE:'A tiger escaped from its enclosure during the night.'},
  
    {t:'p',fr:'avoir peur des animaux',en:'to be afraid of animals',ex:'Elle avouait qu\'elle avait un peu peur des grands chiens.',exE:'She admitted that she was a little afraid of big dogs.'},
    {t:'p',fr:'nourrir un animal',en:'to feed an animal',ex:'Les enfants adoraient nourrir les canards au bord du lac.',exE:'The children loved feeding the ducks by the lake.'},
    {t:'p',fr:'être mordu(e) par un animal',en:'to be bitten by an animal',ex:'La femme avait été mordue par un chien errant dans le parc.',exE:'The woman had been bitten by a stray dog in the park.'},
    {t:'p',fr:'appeler les autorités / la fourrière',en:'to call the authorities / animal control',ex:'Les voisins ont appelé la fourrière pour signaler un animal blessé.',exE:'The neighbours called animal control to report an injured animal.'},
    {t:'p',fr:'être en danger / une espèce en voie de disparition',en:'to be in danger / an endangered species',ex:'Ces animaux sont en danger car leur habitat naturel disparaît progressivement.',exE:'These animals are in danger because their natural habitat is gradually disappearing.'},
    {t:'p',fr:'s\'occuper d\'un animal / en prendre soin',en:'to look after an animal / take care of it',ex:'S\'occuper d\'un animal de compagnie demande beaucoup de temps et d\'énergie.',exE:'Looking after a pet requires a lot of time and energy.'},
    {t:'v',fr:'un animal domestique / sauvage',wc:'nm',en:'a domestic / wild animal',ex:'Contrairement aux animaux sauvages, les animaux domestiques s\'adaptent à la vie en maison.',exE:'Unlike wild animals, domestic animals adapt to life in a home.'},
    {t:'v',fr:'une morsure / une griffure',wc:'nf',en:'a bite / a scratch',ex:'La morsure du chien était assez grave pour nécessiter des soins.',exE:'The dog bite was serious enough to require medical attention.'},
    {t:'v',fr:'adopter un chien / un chat',wc:'v',en:'to adopt a dog / cat',ex:'Elle avait décidé d\'adopter un vieux chien abandonné dans un refuge.',exE:'She had decided to adopt an old abandoned dog from a shelter.'},
    {t:'v',fr:'un refuge pour animaux',wc:'nm',en:'an animal shelter',ex:'Des centaines d\'animaux attendent une famille dans les refuges.',exE:'Hundreds of animals are waiting for a family in shelters.'},
    {t:'v',fr:'interdit(e) / autorisé(e)',wc:'adj',en:'forbidden / allowed',ex:'Les chiens sont interdits dans ce parc depuis l\'incident.',exE:'Dogs have been banned in this park since the incident.'},
    {t:'v',fr:'attirer l\'attention / se faire remarquer',wc:'loc',en:'to attract attention / get noticed',ex:'L\'animal a attiré l\'attention de tous les passants.',exE:'The animal attracted the attention of all the passers-by.'},
    {t:'v',fr:'s\'approcher de / s\'éloigner de',wc:'v',en:'to approach / move away from',ex:'Les secouristes lui ont conseillé de ne pas s\'approcher de l\'animal blessé.',exE:'The rescuers advised him not to approach the injured animal.'},
]},

  {id:'exploits',fr:'Exploits',en:'Records & achievements',c:'#007A42',l:false,items:[
    {t:'p',fr:'se mettre au sport sur le tard / commencer tardivement',en:'to take up sport late in life',ex:'Elle s\'est mise au sport sur le tard, à l\'âge de cinquante-neuf ans.',exE:'She took up sport late in life, at the age of fifty-nine.'},
    {t:'p',fr:'battre un record / entrer dans le livre des records',en:'to break a record / enter the record books',ex:'Le couple a battu le record mondial de longévité conjugale.',exE:'The couple broke the world record for the longest marriage.'},
    {t:'p',fr:'prouver que l\'âge n\'est qu\'un chiffre',en:'to prove that age is just a number',ex:'Elle a prouvé que l\'âge n\'était qu\'un chiffre en terminant son premier marathon.',exE:'She proved that age is just a number by finishing her first marathon.'},
    {t:'p',fr:'contre toute attente, réussir là où…',en:'against all expectations, succeed where…',ex:'Contre toute attente, elle a réussi là où des athlètes professionnels avaient échoué.',exE:'Against all expectations, she succeeded where professional athletes had failed.'},
    {t:'p',fr:'révéler un secret au grand jour',en:'to reveal a secret publicly',ex:'Ce jour-là, ils ont révélé au grand jour le secret qu\'ils gardaient depuis soixante ans.',exE:'That day, they revealed to the world the secret they had kept for sixty years.'},
    {t:'p',fr:'surmonter un obstacle / une épreuve',en:'to overcome an obstacle / ordeal',ex:'Elle a surmonté de nombreuses épreuves avant d\'atteindre son objectif.',exE:'She overcame many ordeals before reaching her goal.'},
    {t:'p',fr:'être une source d\'inspiration',en:'to be a source of inspiration',ex:'Son parcours est devenu une source d\'inspiration pour de nombreux seniors.',exE:'Her journey became a source of inspiration for many seniors.'},
    {t:'v',fr:'malgré + nom',wc:'prép',en:'despite / in spite of',ex:'Elle est devenue athlète malgré son manque total d\'expérience sportive.',exE:'She became an athlete despite her complete lack of sporting experience.'},
    {t:'v',fr:'jusqu\'à l\'âge de…',wc:'loc',en:'until the age of…',ex:'Elle n\'avait jamais fait de sport jusqu\'à l\'âge de cinquante-neuf ans.',exE:'She had never done any sport until the age of fifty-nine.'},
    {t:'v',fr:'exceptionnel(le)',wc:'adj',en:'exceptional / outstanding',ex:'Son exploit était vraiment exceptionnel pour une femme de son âge.',exE:'Her feat was truly exceptional for a woman of her age.'},
    {t:'v',fr:'la persévérance / la ténacité',wc:'nf',en:'perseverance / tenacity',ex:'C\'est grâce à sa persévérance qu\'elle a finalement réussi.',exE:'It is thanks to her perseverance that she finally succeeded.'},
    {t:'v',fr:'un défi',wc:'nm',en:'a challenge',ex:'Elle a décidé de relever ce défi pour prouver qu\'il n\'est jamais trop tard.',exE:'She decided to take up this challenge to prove it is never too late.'},
    {t:'v',fr:'relever un défi',wc:'loc',en:'to take up / rise to a challenge',ex:'À soixante ans, elle a décidé de relever le défi du marathon.',exE:'At sixty, she decided to rise to the challenge of the marathon.'},
    {t:'v',fr:'la longévité',wc:'nf',en:'longevity / long life',ex:'Ce couple est célèbre pour sa longévité conjugale record.',exE:'This couple is famous for their record conjugal longevity.'},
    {t:'v',fr:'s\'acharner',wc:'v',en:'to persevere relentlessly / work stubbornly',ex:'Elle s\'est acharnée pendant des mois avant de réussir sa première course.',exE:'She persevered relentlessly for months before completing her first race.'},
    {t:'v',fr:'un accomplissement',wc:'nm',en:'an achievement / accomplishment',ex:'Terminer ce marathon était un accomplissement personnel immense pour elle.',exE:'Finishing this marathon was an immense personal accomplishment for her.'},
    {t:'v',fr:'inspirer / motiver les autres',wc:'v',en:'to inspire / motivate others',ex:'Son histoire a inspiré des milliers de personnes à travers le monde.',exE:'Her story inspired thousands of people around the world.'},
  
    {t:'p',fr:'ne jamais avoir fait quelque chose avant',en:'to have never done something before',ex:'Elle n\'avait jamais couru plus de deux kilomètres avant ses soixante ans.',exE:'She had never run more than two kilometres before she was sixty.'},
    {t:'p',fr:'tout le monde lui déconseillait de…',en:'everyone advised her against…',ex:'Tout le monde lui déconseillait de se lancer dans cette aventure à son âge.',exE:'Everyone advised her against embarking on this adventure at her age.'},
    {t:'p',fr:'s\'entraîner dur / tous les jours',en:'to train hard / every day',ex:'Pendant deux ans, elle s\'est entraînée tous les jours sans exception.',exE:'For two years, she trained every single day without exception.'},
    {t:'p',fr:'être déterminé(e) à réussir',en:'to be determined to succeed',ex:'Elle était absolument déterminée à réussir, quoi qu\'il arrive.',exE:'She was absolutely determined to succeed, whatever it took.'},
    {t:'p',fr:'réaliser son rêve',en:'to fulfil / achieve one\'s dream',ex:'À l\'âge de soixante-deux ans, elle a finalement réalisé son rêve.',exE:'At the age of sixty-two, she finally fulfilled her dream.'},
    {t:'p',fr:'être reconnu(e) pour ses exploits',en:'to be recognised for one\'s achievements',ex:'Elle a été reconnue et admirée dans le monde entier pour ses exploits.',exE:'She has been recognised and admired around the world for her achievements.'},
    {t:'v',fr:'le courage / le cran',wc:'nm',en:'courage / guts',ex:'Il faut beaucoup de courage pour tout quitter à cinquante ans pour recommencer.',exE:'It takes a lot of courage to leave everything behind at fifty to start over.'},
    {t:'v',fr:'une médaille / un trophée',wc:'nf',en:'a medal / a trophy',ex:'Elle a reçu une médaille pour son parcours extraordinaire.',exE:'She received a medal for her extraordinary journey.'},
    {t:'v',fr:'le dépassement de soi',wc:'nm',en:'self-surpassing / pushing one\'s limits',ex:'Ce marathon représente pour elle un vrai dépassement de soi.',exE:'For her, this marathon represents a true surpassing of one\'s limits.'},
    {t:'v',fr:'ne jamais abandonner',wc:'loc',en:'never to give up',ex:'Sa règle d\'or : ne jamais abandonner, même quand c\'est difficile.',exE:'Her golden rule: never give up, even when it is hard.'},
    {t:'v',fr:'se dépasser / repousser ses limites',wc:'v',en:'to surpass oneself / push one\'s limits',ex:'Elle avait appris à se dépasser chaque jour pendant son entraînement.',exE:'She had learned to push her limits every day during her training.'},
    {t:'v',fr:'une performance / un résultat',wc:'nf',en:'a performance / a result',ex:'Sa performance était d\'autant plus remarquable qu\'elle débutait à soixante ans.',exE:'Her performance was all the more remarkable because she was starting at sixty.'},
    {t:'v',fr:'croire en soi / avoir confiance en soi',wc:'loc',en:'to believe in oneself / be self-confident',ex:'Le secret de sa réussite ? Croire en soi et ne jamais douter.',exE:'The secret of her success? Believe in yourself and never doubt.'},
]},
 ],

 B:[
  {id:'structureB',fr:'Structurer',en:'Argument structure',c:'#FF6B2C',l:false,items:[
    {t:'p',fr:'Je suis tout à fait convaincu(e) que…',en:'I am fully convinced that…',ex:'Je suis tout à fait convaincu qu\'une telle mesure serait bénéfique pour notre société.',exE:'I am fully convinced that such a measure would be beneficial for our society.'},
    {t:'p',fr:'Certes, on peut comprendre que…, mais…',en:'Admittedly… but…',ex:'Certes, on peut comprendre que cette décision soit difficile, mais elle s\'impose.',exE:'Admittedly, one can understand that this decision is difficult, but it is necessary.'},
    {t:'p',fr:'Il faut néanmoins reconnaître que…',en:'Nevertheless, one must recognise that…',ex:'Il faut néanmoins reconnaître que les conséquences seraient considérables.',exE:'Nevertheless, one must recognise that the consequences would be considerable.'},
    {t:'p',fr:'En outre, / De plus,…',en:'Furthermore, / Moreover,…',ex:'En outre, cette mesure aurait un impact positif sur l\'environnement.',exE:'Furthermore, this measure would have a positive impact on the environment.'},
    {t:'p',fr:'Par conséquent, / Ainsi,…',en:'As a result / Therefore / Thus,…',ex:'Par conséquent, il serait urgent d\'agir dès maintenant.',exE:'As a result, it would be urgent to act right now.'},
    {t:'p',fr:'En conclusion, il apparaît clairement que…',en:'In conclusion, it is clear that…',ex:'En conclusion, il apparaît clairement que cette proposition mérite d\'être soutenue.',exE:'In conclusion, it is clear that this proposal deserves support.'},
    {t:'p',fr:'d\'un côté… de l\'autre…',en:'on one hand… on the other…',ex:'D\'un côté, cela favorise l\'autonomie ; de l\'autre, cela crée de l\'isolement.',exE:'On one hand, it promotes autonomy; on the other, it creates isolation.'},
    {t:'p',fr:'Je tiens à souligner que…',en:'I would like to emphasize that…',ex:'Je tiens à souligner que cette question touche directement nos enfants.',exE:'I would like to emphasize that this question directly affects our children.'},
    {t:'p',fr:'Il serait préférable de… plutôt que de…',en:'It would be preferable to… rather than…',ex:'Il serait préférable de limiter plutôt que d\'interdire complètement.',exE:'It would be preferable to limit rather than ban completely.'},
    {t:'p',fr:'Force est de constater que…',en:'One cannot help but notice that… / The fact is that…',ex:'Force est de constater que les résultats ne sont pas à la hauteur des attentes.',exE:'One cannot help but notice that the results do not live up to expectations.'},
    {t:'p',fr:'Il convient de noter que…',en:'It is worth noting that…',ex:'Il convient de noter que cette mesure existe déjà dans plusieurs pays.',exE:'It is worth noting that this measure already exists in several countries.'},
    {t:'p',fr:'En revanche, / En contrepartie,…',en:'On the other hand, / In return,…',ex:'En revanche, les opposants à ce projet soulèvent des arguments valables.',exE:'On the other hand, the opponents of this project raise valid arguments.'},
    {t:'v',fr:'nuancé(e)',wc:'adj',en:'nuanced / balanced',ex:'Il faut adopter une position nuancée sur ce sujet complexe.',exE:'One must adopt a nuanced position on this complex topic.'},
    {t:'v',fr:'souligner / mettre en avant',wc:'v',en:'to underline / highlight',ex:'Je tiens à souligner l\'importance de cette décision pour l\'avenir.',exE:'I would like to highlight the importance of this decision for the future.'},
    {t:'v',fr:'néanmoins / toutefois / cependant',wc:'adv',en:'nevertheless / however / yet',ex:'Néanmoins, il ne faut pas négliger les effets négatifs de cette mesure.',exE:'Nevertheless, one must not neglect the negative effects of this measure.'},
    {t:'v',fr:'il s\'agit de + inf',wc:'loc',en:'it is a matter of / what is at stake is',ex:'Il ne s\'agit pas simplement d\'économiser de l\'argent, mais de sauver des vies.',exE:'It is not simply a matter of saving money, but of saving lives.'},
    {t:'v',fr:'s\'opposer à / être favorable à',wc:'v',en:'to oppose / to be in favour of',ex:'Je m\'oppose fermement à cette décision pour les raisons suivantes.',exE:'I firmly oppose this decision for the following reasons.'},
    {t:'v',fr:'convaincant(e) / persuasif(-ive)',wc:'adj',en:'convincing / persuasive',ex:'Son argument était convaincant mais manquait d\'exemples concrets.',exE:'His argument was convincing but lacked concrete examples.'},
    {t:'v',fr:'il va sans dire que…',en:'it goes without saying that…',wc:'loc',ex:'Il va sans dire que les autorités ont une responsabilité dans cette affaire.',exE:'It goes without saying that the authorities have a responsibility in this matter.'},
    {t:'v',fr:'dans une certaine mesure',wc:'loc',en:'to a certain extent',ex:'Dans une certaine mesure, on peut comprendre la réaction des habitants.',exE:'To a certain extent, one can understand the reaction of the residents.'},
  
    {t:'p',fr:'À mon avis / Selon moi,…',en:'In my opinion / According to me,…',ex:'À mon avis, cette mesure n\'aura pas l\'effet escompté sur la population.',exE:'In my opinion, this measure will not have the desired effect on the population.'},
    {t:'p',fr:'Il me semble que…',en:'It seems to me that…',ex:'Il me semble que nous n\'avons pas encore envisagé toutes les solutions possibles.',exE:'It seems to me that we have not yet considered all the possible solutions.'},
    {t:'p',fr:'Je pense / crois que…',en:'I think / believe that…',ex:'Je pense que chaque citoyen a une responsabilité dans cette situation.',exE:'I think that every citizen has a responsibility in this situation.'},
    {t:'p',fr:'Même si…, il n\'en reste pas moins que…',en:'Even if…, it remains true that…',ex:'Même si les arguments sont valables, il n\'en reste pas moins que l\'impact sera négatif.',exE:'Even if the arguments are valid, it remains true that the impact will be negative.'},
    {t:'p',fr:'Il est vrai que…, mais…',en:'It is true that…, but…',ex:'Il est vrai que cette mesure coûte cher, mais les bénéfices sont considérables.',exE:'It is true that this measure is costly, but the benefits are considerable.'},
    {t:'p',fr:'Je voudrais souligner le fait que…',en:'I would like to highlight the fact that…',ex:'Je voudrais souligner le fait que les jeunes sont les plus touchés par ce problème.',exE:'I would like to highlight the fact that young people are the most affected by this problem.'},
    {t:'v',fr:'Tout d\'abord,… / Premièrement,…',wc:'adv',en:'First of all / Firstly,…',ex:'Tout d\'abord, je souhaite exposer les avantages de cette initiative.',exE:'First of all, I wish to present the advantages of this initiative.'},
    {t:'v',fr:'Deuxièmement,… / De plus,…',wc:'adv',en:'Secondly,… / Furthermore,…',ex:'Deuxièmement, il faut considérer l\'impact environnemental de cette décision.',exE:'Secondly, we must consider the environmental impact of this decision.'},
    {t:'v',fr:'C\'est pourquoi…',wc:'loc',en:'That is why… / This is why…',ex:'C\'est pourquoi je vous encourage à soutenir cette proposition.',exE:'That is why I encourage you to support this proposal.'},
    {t:'v',fr:'en effet / effectivement',wc:'adv',en:'indeed / in fact',ex:'En effet, les chiffres prouvent que la situation empire depuis trois ans.',exE:'Indeed, the figures prove that the situation has been getting worse for three years.'},
    {t:'v',fr:'il faut + inf / il est nécessaire de',wc:'loc',en:'it is necessary to / one must',ex:'Il faut agir maintenant pour éviter que la situation empire encore davantage.',exE:'It is necessary to act now to prevent the situation from getting even worse.'},
    {t:'v',fr:'pour ces raisons,…',wc:'loc',en:'for these reasons,…',ex:'Pour ces raisons, je vous demande de reconsidérer votre décision.',exE:'For these reasons, I ask you to reconsider your decision.'},
    {t:'v',fr:'je vous remercie de bien vouloir…',wc:'form',en:'I thank you for kindly… (formal letter close)',ex:'Je vous remercie de bien vouloir prendre en compte mes suggestions.',exE:'I thank you for kindly taking my suggestions into account.'},
    {t:'v',fr:'dans l\'attente de votre réponse,…',wc:'form',en:'awaiting your reply,… (formal close)',ex:'Dans l\'attente de votre réponse, je vous adresse mes cordiales salutations.',exE:'Awaiting your reply, I extend my warmest regards.'},
]},

  {id:'techno',fr:'Technologie',en:'Technology & screens',c:'#0A6CF0',l:false,items:[
    {t:'p',fr:'être accro à son téléphone / aux écrans',en:'to be addicted to one\'s phone / screens',ex:'De plus en plus de jeunes sont accros à leur téléphone portable.',exE:'More and more young people are addicted to their mobile phones.'},
    {t:'p',fr:'faire défiler les réseaux sociaux pendant des heures',en:'to scroll through social media for hours',ex:'On passe des heures à faire défiler les réseaux sociaux sans vraiment s\'en rendre compte.',exE:'We spend hours scrolling through social media without even realising it.'},
    {t:'p',fr:'limiter le temps d\'écran dès le plus jeune âge',en:'to limit screen time from an early age',ex:'Il faudrait limiter le temps d\'écran dès le plus jeune âge.',exE:'Screen time should be limited from a very young age.'},
    {t:'p',fr:'nous sommes devenus des marchandises',en:'we have become commodities',ex:'Avec Internet, nos données personnelles font de nous de véritables marchandises.',exE:'With the Internet, our personal data has made us into real commodities.'},
    {t:'p',fr:'supprimer la publicité ciblée destinée aux mineurs',en:'to ban targeted advertising aimed at minors',ex:'Il faudrait supprimer la publicité ciblée destinée aux enfants de moins de treize ans.',exE:'Targeted advertising aimed at children under thirteen should be banned.'},
    {t:'p',fr:'les nouvelles technologies transforment profondément nos vies',en:'new technologies are profoundly transforming our lives',ex:'Les nouvelles technologies transforment profondément nos modes de communication.',exE:'New technologies are profoundly transforming our ways of communicating.'},
    {t:'p',fr:'l\'IA représente une menace / une opportunité',en:'AI represents a threat / an opportunity',ex:'L\'intelligence artificielle représente à la fois une menace et une formidable opportunité.',exE:'Artificial intelligence represents both a threat and a wonderful opportunity.'},
    {t:'v',fr:'une dépendance / l\'addiction',wc:'nf',en:'an addiction / dependency',ex:'La dépendance aux écrans touche désormais toutes les générations.',exE:'Screen addiction now affects every generation.'},
    {t:'v',fr:'nuire à la concentration / au sommeil',wc:'v',en:'to harm concentration / sleep',ex:'Les écrans nuisent à la concentration des enfants en classe.',exE:'Screens harm children\'s concentration in class.'},
    {t:'v',fr:'une publicité ciblée',wc:'nf',en:'targeted advertising',ex:'La publicité ciblée s\'adresse même aux enfants de moins de dix ans.',exE:'Targeted advertising even targets children under ten years old.'},
    {t:'v',fr:'les données personnelles',wc:'nfpl',en:'personal data',ex:'Nos données personnelles sont vendues à des entreprises sans notre accord.',exE:'Our personal data is sold to companies without our consent.'},
    {t:'v',fr:'la désinformation / les fausses nouvelles',wc:'nf',en:'disinformation / fake news',ex:'La désinformation se propage très rapidement sur les réseaux sociaux.',exE:'Disinformation spreads very quickly on social media.'},
    {t:'v',fr:'l\'intelligence artificielle (IA)',wc:'nf',en:'artificial intelligence (AI)',ex:'L\'intelligence artificielle va bouleverser de nombreux secteurs d\'activité.',exE:'Artificial intelligence will disrupt many sectors of activity.'},
    {t:'v',fr:'la vie privée numérique',wc:'nf',en:'digital privacy',ex:'La protection de la vie privée numérique est devenue un enjeu majeur.',exE:'The protection of digital privacy has become a major issue.'},
    {t:'v',fr:'un algorithme',wc:'nm',en:'an algorithm',ex:'Les algorithmes des réseaux sociaux nous exposent à des contenus de plus en plus ciblés.',exE:'Social media algorithms expose us to increasingly targeted content.'},
    {t:'v',fr:'s\'en rendre compte',wc:'loc',en:'to realise it / become aware of it',ex:'On passe trop de temps en ligne sans vraiment s\'en rendre compte.',exE:'We spend too much time online without really realising it.'},
    {t:'v',fr:'le cyberharcèlement',wc:'nm',en:'cyberbullying / online harassment',ex:'Le cyberharcèlement touche de nombreux adolescents sur les réseaux sociaux.',exE:'Cyberbullying affects many teenagers on social media.'},
    {t:'v',fr:'réguler / encadrer',wc:'v',en:'to regulate / oversee',ex:'Il est urgent de mieux réguler l\'usage d\'Internet par les mineurs.',exE:'It is urgent to better regulate children\'s use of the Internet.'},
    {t:'v',fr:'une fracture numérique',wc:'nf',en:'a digital divide',ex:'La fracture numérique creuse les inégalités entre générations et milieux sociaux.',exE:'The digital divide deepens inequalities between generations and social groups.'},
  
    {t:'p',fr:'utiliser son téléphone pour tout',en:'to use one\'s phone for everything',ex:'Aujourd\'hui, on utilise son téléphone pour tout : payer, naviguer, communiquer.',exE:'Today, people use their phones for everything: paying, navigating, communicating.'},
    {t:'p',fr:'ne plus pouvoir se passer de + nom',en:'to no longer be able to do without something',ex:'Beaucoup de gens ne peuvent plus se passer de leur téléphone, même une heure.',exE:'Many people can no longer do without their phones, even for an hour.'},
    {t:'p',fr:'cela pose un problème de…',en:'this raises a problem of…',ex:'Cela pose un vrai problème de santé mentale, notamment chez les adolescents.',exE:'This raises a real mental health problem, especially among teenagers.'},
    {t:'p',fr:'on ne peut pas nier que…',en:'one cannot deny that…',ex:'On ne peut pas nier que les réseaux sociaux ont changé notre façon de communiquer.',exE:'One cannot deny that social media has changed the way we communicate.'},
    {t:'p',fr:'il est difficile d\'imaginer une vie sans…',en:'it is hard to imagine a life without…',ex:'Il est difficile d\'imaginer une vie sans Internet dans notre société moderne.',exE:'It is hard to imagine a life without the Internet in our modern society.'},
    {t:'p',fr:'d\'un côté, cela facilite… de l\'autre, cela risque de…',en:'on one hand it makes… easier; on the other, it risks…',ex:'D\'un côté, cela facilite les échanges ; de l\'autre, cela risque de remplacer le lien humain.',exE:'On one hand it makes communication easier; on the other, it risks replacing human bonds.'},
    {t:'v',fr:'en ligne / hors ligne',wc:'adj',en:'online / offline',ex:'La majorité des jeunes passent plus de cinq heures par jour en ligne.',exE:'The majority of young people spend more than five hours a day online.'},
    {t:'v',fr:'un réseau social',wc:'nm',en:'a social network / social media platform',ex:'Les réseaux sociaux sont devenus le principal outil de communication des jeunes.',exE:'Social networks have become the main communication tool for young people.'},
    {t:'v',fr:'partager / publier',wc:'v',en:'to share / post',ex:'Elle publiait chaque jour des photos et des vidéos sur ses réseaux sociaux.',exE:'She posted photos and videos on her social media every day.'},
    {t:'v',fr:'une application (appli)',wc:'nf',en:'an application (app)',ex:'Il existe des applications pour contrôler le temps passé devant les écrans.',exE:'There are apps to monitor the time spent in front of screens.'},
    {t:'v',fr:'le bien-être numérique',wc:'nm',en:'digital well-being',ex:'Le concept de bien-être numérique invite à une utilisation plus consciente d\'Internet.',exE:'The concept of digital well-being invites more conscious use of the Internet.'},
    {t:'v',fr:'une menace / un danger',wc:'nf',en:'a threat / danger',ex:'La désinformation représente une véritable menace pour la démocratie.',exE:'Disinformation represents a real threat to democracy.'},
    {t:'v',fr:'protéger les mineurs',wc:'v',en:'to protect minors',ex:'Il faut trouver des solutions concrètes pour mieux protéger les mineurs en ligne.',exE:'Concrete solutions must be found to better protect minors online.'},
]},

  {id:'education',fr:'Éducation',en:'School & education',c:'#FF3D8B',l:false,items:[
    {t:'p',fr:'supprimer les notes à l\'école primaire',en:'to abolish grades in primary school',ex:'Certains pédagogues proposent de supprimer les notes à l\'école primaire.',exE:'Some educators propose abolishing grades in primary school.'},
    {t:'p',fr:'s\'épanouir à l\'école plutôt que subir la pression',en:'to thrive at school rather than suffer pressure',ex:'Un enfant doit pouvoir s\'épanouir à l\'école, pas seulement réussir ses examens.',exE:'A child should be able to thrive at school, not just pass exams.'},
    {t:'p',fr:'tuer la motivation des élèves',en:'to kill students\' motivation',ex:'Une école trop compétitive risque de tuer la motivation des élèves les plus fragiles.',exE:'An overly competitive school risks killing the motivation of the most vulnerable students.'},
    {t:'p',fr:'encourager l\'esprit critique plutôt que la mémorisation',en:'to encourage critical thinking rather than memorisation',ex:'L\'école devrait davantage encourager l\'esprit critique plutôt que la mémorisation.',exE:'School should do more to encourage critical thinking rather than memorisation.'},
    {t:'p',fr:'réduire le décrochage scolaire',en:'to reduce school dropout rates',ex:'Des mesures concrètes sont nécessaires pour réduire le décrochage scolaire.',exE:'Concrete measures are needed to reduce school dropout rates.'},
    {t:'p',fr:'interdire / permettre les smartphones en classe',en:'to ban / allow smartphones in class',ex:'Des professeurs proposent d\'utiliser les smartphones en classe pour rendre les cours plus interactifs.',exE:'Some teachers propose using smartphones in class to make lessons more interactive.'},
    {t:'p',fr:'favoriser l\'inclusion scolaire',en:'to promote school inclusion',ex:'Il est essentiel de favoriser l\'inclusion scolaire des enfants en situation de handicap.',exE:'It is essential to promote the school inclusion of children with disabilities.'},
    {t:'v',fr:'la pression scolaire',wc:'nf',en:'academic pressure',ex:'La pression scolaire pèse de plus en plus lourdement sur les jeunes élèves.',exE:'Academic pressure weighs more and more heavily on young students.'},
    {t:'v',fr:'s\'épanouir',wc:'v',en:'to flourish / thrive',ex:'Il est important que les enfants puissent s\'épanouir à l\'école.',exE:'It is important that children can flourish at school.'},
    {t:'v',fr:'le décrochage scolaire',wc:'nm',en:'school dropout / disengagement',ex:'Le décrochage scolaire est un phénomène préoccupant dans de nombreux pays.',exE:'School dropout is a worrying phenomenon in many countries.'},
    {t:'v',fr:'la bienveillance',wc:'nf',en:'caring / compassionate approach',ex:'Une pédagogie fondée sur la bienveillance donne de meilleurs résultats à long terme.',exE:'A compassionate teaching approach gives better results in the long run.'},
    {t:'v',fr:'l\'enseignement obligatoire',wc:'nm',en:'compulsory education',ex:'L\'enseignement obligatoire jusqu\'à seize ans est une conquête sociale importante.',exE:'Compulsory education until sixteen is an important social achievement.'},
    {t:'v',fr:'la pédagogie / une méthode pédagogique',wc:'nf',en:'pedagogy / a teaching method',ex:'Une pédagogie innovante peut transformer radicalement l\'attitude des élèves.',exE:'An innovative teaching method can radically transform students\' attitude.'},
    {t:'v',fr:'inégalités scolaires',wc:'nfpl',en:'educational inequalities',ex:'Les inégalités scolaires se creusent entre les élèves des milieux aisés et défavorisés.',exE:'Educational inequalities are growing between students from wealthy and deprived backgrounds.'},
    {t:'v',fr:'la formation à distance / en ligne',wc:'nf',en:'distance / online learning',ex:'La formation à distance ne remplace pas totalement le contact humain en classe.',exE:'Distance learning does not fully replace human contact in the classroom.'},
    {t:'v',fr:'l\'autonomie des élèves',wc:'nf',en:'pupils\' autonomy / independence',ex:'Il faudrait davantage développer l\'autonomie des élèves dès le primaire.',exE:'Students\' autonomy should be developed more from primary school onwards.'},
    {t:'v',fr:'évaluer / noter',wc:'v',en:'to assess / grade',ex:'Évaluer un élève uniquement par ses notes ne reflète pas toutes ses compétences.',exE:'Assessing a pupil solely by their grades does not reflect all their skills.'},
    {t:'v',fr:'le harcèlement scolaire',wc:'nm',en:'school bullying',ex:'Le harcèlement scolaire reste un problème grave souvent sous-estimé.',exE:'School bullying remains a serious problem that is often underestimated.'},
  
    {t:'p',fr:'avoir du mal à se concentrer en classe',en:'to have difficulty concentrating in class',ex:'De nombreux élèves ont du mal à se concentrer en classe à cause des écrans.',exE:'Many pupils have difficulty concentrating in class because of screens.'},
    {t:'p',fr:'s\'épanouir grâce à l\'école',en:'to thrive / flourish thanks to school',ex:'L\'école devrait permettre à chaque enfant de s\'épanouir à son rythme.',exE:'School should allow every child to thrive at their own pace.'},
    {t:'p',fr:'tout le monde n\'apprend pas de la même façon',en:'not everyone learns in the same way',ex:'Il est important de reconnaître que tout le monde n\'apprend pas de la même façon.',exE:'It is important to recognise that not everyone learns in the same way.'},
    {t:'p',fr:'donner le goût d\'apprendre',en:'to inspire a love of learning',ex:'Le rôle de l\'enseignant est aussi de donner le goût d\'apprendre aux élèves.',exE:'The teacher\'s role is also to inspire a love of learning in pupils.'},
    {t:'p',fr:'être à la hauteur des attentes',en:'to live up to expectations',ex:'Certains élèves ont peur de ne pas être à la hauteur des attentes.',exE:'Some pupils are afraid of not living up to expectations.'},
    {t:'p',fr:'avoir de bonnes / mauvaises notes',en:'to have good / bad grades',ex:'Elle avait de très bonnes notes mais ne se sentait pas épanouie pour autant.',exE:'She had very good grades but did not feel fulfilled for all that.'},
    {t:'v',fr:'un enseignant / un professeur',wc:'nm',en:'a teacher',ex:'Un bon enseignant sait s\'adapter au niveau de chaque élève.',exE:'A good teacher knows how to adapt to the level of each pupil.'},
    {t:'v',fr:'les résultats scolaires',wc:'nm pl',en:'academic results / school performance',ex:'Les résultats scolaires ne reflètent pas toujours le vrai potentiel d\'un élève.',exE:'Academic results do not always reflect a pupil\'s true potential.'},
    {t:'v',fr:'apprendre par cœur / mémoriser',wc:'v',en:'to learn by heart / to memorise',ex:'Apprendre par cœur des listes de dates ne développe pas l\'esprit critique.',exE:'Learning lists of dates by heart does not develop critical thinking.'},
    {t:'v',fr:'un élève / un étudiant',wc:'nm',en:'a pupil / a student',ex:'Les élèves les plus brillants ne sont pas toujours ceux qui réussissent le mieux.',exE:'The brightest pupils are not always those who do best.'},
    {t:'v',fr:'une école privée / publique',wc:'nf',en:'a private / state school',ex:'Il y a un grand débat sur les avantages des écoles privées par rapport aux publiques.',exE:'There is a major debate on the advantages of private schools versus state schools.'},
    {t:'v',fr:'le système éducatif',wc:'nm',en:'the education system',ex:'Le système éducatif français est souvent critiqué pour être trop élitiste.',exE:'The French education system is often criticised for being too elitist.'},
    {t:'v',fr:'réussir / échouer à un examen',wc:'v',en:'to pass / fail an exam',ex:'Il a réussi son baccalauréat du premier coup avec mention très bien.',exE:'He passed his baccalaureate first time with the highest distinction.'},
]},

  {id:'environnement',fr:'Environnement',en:'Environment & consumption',c:'#007A42',l:false,items:[
    {t:'p',fr:'réduire sa consommation de manière significative',en:'to significantly cut down on consumption',ex:'Il faudrait réduire sa consommation de vêtements neufs de manière significative.',exE:'We should significantly cut down on buying new clothes.'},
    {t:'p',fr:'lutter concrètement contre la pollution',en:'to concretely fight against pollution',ex:'Les gouvernements doivent prendre des mesures concrètes pour lutter contre la pollution.',exE:'Governments must take concrete measures to fight against pollution.'},
    {t:'p',fr:'interdire les vols courts au profit du train',en:'to ban short-haul flights in favour of the train',ex:'Certains pays ont déjà interdit les vols courts au profit du transport ferroviaire.',exE:'Some countries have already banned short-haul flights in favour of rail transport.'},
    {t:'p',fr:'opter pour des énergies renouvelables',en:'to opt for renewable energies',ex:'Il est urgent d\'opter pour des énergies renouvelables afin de réduire nos émissions.',exE:'It is urgent to opt for renewable energies in order to reduce our emissions.'},
    {t:'p',fr:'nuire gravement à l\'environnement',en:'to seriously harm the environment',ex:'L\'industrie textile nuit gravement à l\'environnement et aux ressources en eau.',exE:'The textile industry seriously harms the environment and water resources.'},
    {t:'p',fr:'adopter un mode de vie plus sobre',en:'to adopt a more sober / simpler lifestyle',ex:'Il est possible d\'adopter un mode de vie plus sobre sans sacrifier son confort.',exE:'It is possible to adopt a simpler lifestyle without sacrificing one\'s comfort.'},
    {t:'p',fr:'sensibiliser le grand public à…',en:'to raise public awareness of…',ex:'Il est essentiel de sensibiliser le grand public aux enjeux du réchauffement climatique.',exE:'It is essential to raise public awareness of the challenges of climate change.'},
    {t:'v',fr:'les emballages plastiques',wc:'nmpl',en:'plastic packaging',ex:'Les industries devraient urgemment supprimer les emballages plastiques inutiles.',exE:'Industries should urgently eliminate unnecessary plastic packaging.'},
    {t:'v',fr:'l\'empreinte carbone',wc:'nf',en:'carbon footprint',ex:'Prendre l\'avion régulièrement augmente fortement son empreinte carbone.',exE:'Flying regularly greatly increases one\'s carbon footprint.'},
    {t:'v',fr:'la mode éphémère / fast fashion',wc:'nf',en:'fast fashion / throwaway fashion',ex:'La mode éphémère pousse les consommateurs à acheter sans réfléchir aux conséquences.',exE:'Fast fashion pushes consumers to buy without thinking about the consequences.'},
    {t:'v',fr:'le développement durable',wc:'nm',en:'sustainable development',ex:'Le développement durable doit devenir une priorité pour toutes les entreprises.',exE:'Sustainable development must become a priority for all companies.'},
    {t:'v',fr:'le réchauffement climatique',wc:'nm',en:'global warming / climate change',ex:'Le réchauffement climatique menace des millions d\'espèces animales.',exE:'Global warming threatens millions of animal species.'},
    {t:'v',fr:'les énergies renouvelables',wc:'nfpl',en:'renewable energies',ex:'Les énergies renouvelables représentent l\'avenir de notre système énergétique.',exE:'Renewable energies represent the future of our energy system.'},
    {t:'v',fr:'la transition écologique',wc:'nf',en:'the ecological transition',ex:'La transition écologique nécessite des efforts collectifs et individuels.',exE:'The ecological transition requires collective and individual efforts.'},
    {t:'v',fr:'une prise de conscience',wc:'nf',en:'an awareness / a realisation',ex:'Une véritable prise de conscience est nécessaire pour changer nos comportements.',exE:'A genuine awareness is needed to change our behaviour.'},
    {t:'v',fr:'un geste écologique',wc:'nm',en:'an eco-friendly action / green gesture',ex:'Chaque geste écologique, même petit, contribue à la protection de l\'environnement.',exE:'Every eco-friendly action, however small, contributes to environmental protection.'},
    {t:'v',fr:'irresponsable / inconscient(e)',wc:'adj',en:'irresponsible / reckless',ex:'Acheter des vêtements sans penser à l\'environnement est devenu irresponsable.',exE:'Buying clothes without thinking about the environment has become irresponsible.'},
    {t:'v',fr:'les émissions de gaz à effet de serre',wc:'nfpl',en:'greenhouse gas emissions',ex:'Il faut réduire les émissions de gaz à effet de serre de 50 % d\'ici 2030.',exE:'Greenhouse gas emissions must be reduced by 50% by 2030.'},
  
    {t:'p',fr:'nous avons tous un rôle à jouer',en:'we all have a role to play',ex:'Face au changement climatique, nous avons tous un rôle à jouer.',exE:'In the face of climate change, we all have a role to play.'},
    {t:'p',fr:'les gestes du quotidien pour l\'environnement',en:'everyday gestures for the environment',ex:'Les gestes du quotidien — trier, économiser l\'eau — font une vraie différence.',exE:'Everyday gestures — sorting waste, saving water — make a real difference.'},
    {t:'p',fr:'cela nuit à l\'environnement',en:'this harms the environment',ex:'La production excessive de plastique nuit gravement à l\'environnement marin.',exE:'The excessive production of plastic seriously harms the marine environment.'},
    {t:'p',fr:'prendre conscience du problème',en:'to become aware of the problem',ex:'De plus en plus de citoyens prennent conscience du problème climatique.',exE:'More and more citizens are becoming aware of the climate problem.'},
    {t:'p',fr:'agir avant qu\'il ne soit trop tard',en:'to act before it is too late',ex:'Il faut agir collectivement avant qu\'il ne soit trop tard pour notre planète.',exE:'We must act collectively before it is too late for our planet.'},
    {t:'p',fr:'réduire son empreinte carbone',en:'to reduce one\'s carbon footprint',ex:'Chacun peut réduire son empreinte carbone en changeant quelques habitudes.',exE:'Each person can reduce their carbon footprint by changing a few habits.'},
    {t:'v',fr:'le réchauffement climatique',wc:'nm',en:'global warming / climate change',ex:'Le réchauffement climatique représente un défi majeur pour notre génération.',exE:'Global warming represents a major challenge for our generation.'},
    {t:'v',fr:'les énergies renouvelables',wc:'nfpl',en:'renewable energy',ex:'L\'investissement dans les énergies renouvelables est essentiel pour l\'avenir.',exE:'Investment in renewable energy is essential for the future.'},
    {t:'v',fr:'trier ses déchets / le recyclage',wc:'v',en:'to sort one\'s waste / recycling',ex:'Trier ses déchets est un geste simple mais efficace pour l\'environnement.',exE:'Sorting your waste is a simple but effective gesture for the environment.'},
    {t:'v',fr:'polluer / la pollution',wc:'v/nf',en:'to pollute / pollution',ex:'La pollution de l\'air dans les grandes villes atteint des niveaux alarmants.',exE:'Air pollution in large cities is reaching alarming levels.'},
    {t:'v',fr:'une catastrophe naturelle',wc:'nf',en:'a natural disaster',ex:'Les catastrophes naturelles deviennent de plus en plus fréquentes et violentes.',exE:'Natural disasters are becoming increasingly frequent and violent.'},
    {t:'v',fr:'s\'engager pour / militer pour',wc:'v',en:'to commit to / campaign for',ex:'Des milliers de jeunes militants s\'engagent pour la protection du climat.',exE:'Thousands of young activists commit to protecting the climate.'},
    {t:'v',fr:'durable / le développement durable',wc:'adj/nm',en:'sustainable / sustainable development',ex:'Il est urgent d\'adopter un modèle de développement durable à l\'échelle mondiale.',exE:'It is urgent to adopt a sustainable development model on a global scale.'},
]},

  {id:'sante',fr:'Santé',en:'Health & lifestyle',c:'#FF6B2C',l:false,items:[
    {t:'p',fr:'manger sainement sans se priver',en:'to eat healthily without depriving oneself',ex:'Il est possible de manger sainement sans se priver ni devenir végétarien.',exE:'It is possible to eat healthily without depriving oneself or becoming vegetarian.'},
    {t:'p',fr:'adopter un régime végétarien / végétalien',en:'to adopt a vegetarian / vegan diet',ex:'Adopter un régime végétarien n\'est pas la seule façon d\'être en bonne santé.',exE:'Adopting a vegetarian diet is not the only way to be healthy.'},
    {t:'p',fr:'prendre soin de sa santé physique et mentale',en:'to take care of one\'s physical and mental health',ex:'Il est essentiel de prendre soin de sa santé physique autant que mentale.',exE:'It is essential to take care of one\'s physical health as much as mental health.'},
    {t:'p',fr:'les gens ne mangent plus que de l\'alimentation industrielle',en:'people eat nothing but processed food',ex:'De nos jours, beaucoup de gens ne mangent plus que de l\'alimentation industrielle.',exE:'Nowadays, many people eat nothing but processed food.'},
    {t:'p',fr:'lutter contre la sédentarité',en:'to fight against a sedentary lifestyle',ex:'Il est urgent de lutter contre la sédentarité, notamment chez les jeunes.',exE:'It is urgent to fight against sedentary lifestyles, particularly among young people.'},
    {t:'p',fr:'accès à des soins de santé de qualité',en:'access to quality healthcare',ex:'L\'accès à des soins de santé de qualité ne devrait pas dépendre du revenu.',exE:'Access to quality healthcare should not depend on income.'},
    {t:'p',fr:'privilégier les produits locaux et de saison',en:'to favour local and seasonal products',ex:'Il faudrait davantage privilégier les produits locaux et de saison dans notre alimentation.',exE:'We should favour local and seasonal products more in our diet.'},
    {t:'v',fr:'une alimentation malsaine / équilibrée',wc:'nf',en:'an unhealthy / balanced diet',ex:'Beaucoup de gens ont une alimentation malsaine par manque de temps et d\'argent.',exE:'Many people have an unhealthy diet due to lack of time and money.'},
    {t:'v',fr:'l\'alimentation industrielle',wc:'nf',en:'processed / industrial food',ex:'L\'alimentation industrielle est souvent trop riche en sucres et en graisses.',exE:'Processed food is often too high in sugars and fats.'},
    {t:'v',fr:'les habitudes alimentaires',wc:'nfpl',en:'eating habits / dietary habits',ex:'Les habitudes alimentaires se forment dès l\'enfance et sont difficiles à changer.',exE:'Eating habits are formed in childhood and are hard to change.'},
    {t:'v',fr:'la sédentarité',wc:'nf',en:'sedentary lifestyle / physical inactivity',ex:'La sédentarité favorise de nombreuses maladies chroniques.',exE:'A sedentary lifestyle promotes many chronic diseases.'},
    {t:'v',fr:'la prévention',wc:'nf',en:'prevention',ex:'La médecine préventive coûte moins cher que la médecine curative.',exE:'Preventive medicine costs less than curative medicine.'},
    {t:'v',fr:'l\'obésité',wc:'nf',en:'obesity',ex:'L\'obésité est devenue un problème de santé publique majeur dans de nombreux pays.',exE:'Obesity has become a major public health problem in many countries.'},
    {t:'v',fr:'le bien-être',wc:'nm',en:'well-being / wellness',ex:'Le bien-être ne se résume pas à l\'absence de maladie.',exE:'Well-being is not simply the absence of illness.'},
    {t:'v',fr:'une perte de temps (ne pas être)',wc:'nf',en:'a waste of time (not to be)',ex:'Apprendre à cuisiner n\'est jamais une perte de temps, au contraire.',exE:'Learning to cook is never a waste of time, quite the opposite.'},
    {t:'v',fr:'chronique / récurrent(e)',wc:'adj',en:'chronic / recurring',ex:'Les maladies chroniques liées à l\'alimentation sont en forte augmentation.',exE:'Diet-related chronic illnesses are strongly on the rise.'},
    {t:'v',fr:'la médecine préventive',wc:'nf',en:'preventive medicine',ex:'Investir dans la médecine préventive permet de réduire les coûts de santé.',exE:'Investing in preventive medicine helps reduce healthcare costs.'},
    {t:'v',fr:'en bonne santé / en mauvaise santé',wc:'loc',en:'in good / poor health',ex:'Pour rester en bonne santé, l\'alimentation seule ne suffit pas.',exE:'To remain in good health, diet alone is not enough.'},
  
    {t:'p',fr:'prendre soin de sa santé',en:'to take care of one\'s health',ex:'Il est important de prendre soin de sa santé dès le plus jeune âge.',exE:'It is important to take care of one\'s health from a very young age.'},
    {t:'p',fr:'avoir une alimentation équilibrée',en:'to have a balanced diet',ex:'Avoir une alimentation équilibrée est la base d\'une bonne santé.',exE:'Having a balanced diet is the foundation of good health.'},
    {t:'p',fr:'faire du sport régulièrement',en:'to do sport regularly',ex:'Faire du sport régulièrement aide à réduire le stress et améliore le sommeil.',exE:'Doing sport regularly helps to reduce stress and improves sleep.'},
    {t:'p',fr:'cela a des effets néfastes sur la santé',en:'this has harmful effects on health',ex:'La consommation excessive de sucre a des effets néfastes sur la santé.',exE:'Excessive sugar consumption has harmful effects on health.'},
    {t:'p',fr:'se sentir bien dans sa peau',en:'to feel comfortable in one\'s own skin / feel good about oneself',ex:'L\'objectif n\'est pas d\'être parfait, mais de se sentir bien dans sa peau.',exE:'The goal is not to be perfect, but to feel good about oneself.'},
    {t:'p',fr:'aller chez le médecin / consulter un spécialiste',en:'to go to the doctor / consult a specialist',ex:'Trop de gens évitent d\'aller chez le médecin par peur ou par négligence.',exE:'Too many people avoid going to the doctor out of fear or neglect.'},
    {t:'v',fr:'la santé mentale',wc:'nf',en:'mental health',ex:'La santé mentale est aussi importante que la santé physique.',exE:'Mental health is just as important as physical health.'},
    {t:'v',fr:'les habitudes alimentaires',wc:'nfpl',en:'eating habits / dietary habits',ex:'Les mauvaises habitudes alimentaires se forment souvent dès l\'enfance.',exE:'Bad eating habits often form in childhood.'},
    {t:'v',fr:'une maladie / tomber malade',wc:'nf/loc',en:'an illness / to fall ill',ex:'Il est tombé malade après avoir négligé sa santé pendant trop longtemps.',exE:'He fell ill after neglecting his health for too long.'},
    {t:'v',fr:'soigner / guérir',wc:'v',en:'to treat / to heal / to cure',ex:'Les médecins ont pu soigner la maladie grâce à un nouveau traitement.',exE:'The doctors were able to treat the illness thanks to a new treatment.'},

 ]
