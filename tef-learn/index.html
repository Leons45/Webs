<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Écrire — TEF Writing Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #FFFCF4;
  --ink:     #16121F;
  --soft:    #6D6480;
  --hair:    #E3DCCD;
  --jaune:   #FFC400;
  --rose:    #FF3D8B;
  --orange:  #FF6B2C;
  --violet:  #7B5BD6;
  --vert:    #007A42;
  --bleu:    #0A6CF0;
  --sarcelle:#00968F;
  --r: 10px;
  --pop: 3px 3px 0 var(--ink);
  --ff-display: 'Fraunces', Georgia, serif;
  --ff-ui: 'DM Sans', system-ui, sans-serif;
  --accent: var(--violet);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ff-ui);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── header ─────────────────────────────────── */
.header {
  padding: 16px 20px 12px;
  border-bottom: 1.5px solid var(--hair);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 10;
}
.wordmark {
  font-family: var(--ff-display);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  flex-shrink: 0;
}
.wordmark span { color: var(--accent); }

/* ── section toggle ──────────────────────────── */
.section-toggle {
  display: flex;
  gap: 4px;
  background: var(--hair);
  border-radius: 8px;
  padding: 3px;
}
.section-toggle button {
  font-family: var(--ff-ui);
  font-size: 0.75rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--soft);
  padding: 5px 11px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.section-toggle button.active {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}

/* ── progress bar ─────────────────────────────── */
.progress-bar { height: 3px; background: var(--hair); }
.progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }

/* ── topic pills ─────────────────────────────── */
.topics-scroller {
  padding: 12px 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1.5px solid var(--hair);
}
.topics-scroller::-webkit-scrollbar { display: none; }
.topics-row { display: flex; gap: 7px; width: max-content; }
.topic-pill {
  font-family: var(--ff-ui);
  font-size: 0.78rem;
  font-weight: 600;
  border: 2px solid var(--hair);
  padding: 5px 13px;
  border-radius: 100px;
  cursor: pointer;
  background: transparent;
  color: var(--ink);
  transition: border-color .15s, background .15s, color .15s, box-shadow .12s;
  white-space: nowrap;
}
.topic-pill:hover { border-color: var(--ink); }
.topic-pill.active {
  background: var(--topic-color, var(--accent));
  border-color: var(--topic-color, var(--accent));
  color: white;
  box-shadow: var(--pop);
}
.topic-pill.active.light { color: var(--ink); }

/* ── type filter bar ─────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px 0;
  gap: 12px;
}
.type-tabs {
  display: flex;
  gap: 3px;
  background: var(--hair);
  border-radius: 8px;
  padding: 3px;
}
.type-tab {
  font-family: var(--ff-ui);
  font-size: 0.72rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--soft);
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.type-tab.active {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.counter-label { font-size: 0.74rem; color: var(--soft); font-weight: 500; }
.known-count { font-size: 0.74rem; font-weight: 600; color: var(--vert); }

/* ── card area ───────────────────────────────── */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 20px 20px;
  gap: 14px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--r);
  box-shadow: var(--pop);
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  transition: transform .12s, box-shadow .12s;
  position: relative;
}
.card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.card-accent { height: 5px; background: var(--topic-color, var(--accent)); }

/* type badge on card */
.card-type-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 10px;
}
.badge-vocab {
  background: color-mix(in srgb, var(--topic-color, var(--accent)) 15%, transparent);
  color: var(--topic-color, var(--accent));
}
.badge-phrase {
  background: color-mix(in srgb, var(--ink) 8%, transparent);
  color: var(--soft);
}

.card-body { padding: 20px 22px 18px; }

.card-fr {
  font-family: var(--ff-display);
  font-size: clamp(1.2rem, 4vw, 1.65rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 8px;
}
/* vocab: show word type hint */
.card-fr .word-class {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 0.75em;
  font-weight: 400;
  color: var(--soft);
  margin-left: 6px;
}

.card-en {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--soft);
  line-height: 1.4;
}

.card-example {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1.5px solid var(--hair);
  display: none;
}
.card-example.open { display: block; }
.example-label {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--topic-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: 6px;
}
.example-fr {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 0.93rem;
  line-height: 1.55;
  color: var(--ink);
  margin-bottom: 5px;
}
.example-en { font-size: 0.8rem; color: var(--soft); line-height: 1.5; }

.tap-hint {
  position: absolute;
  bottom: 9px;
  right: 13px;
  font-size: 0.63rem;
  color: var(--hair);
  font-weight: 500;
  transition: color .2s;
}
.card:hover .tap-hint { color: var(--soft); }

/* known badge */
.known-badge {
  position: absolute;
  top: 11px;
  right: 13px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--vert);
  display: none;
  align-items: center;
  justify-content: center;
}
.known-badge.show { display: flex; }
.known-badge svg { width: 11px; height: 11px; fill: none; stroke: white; stroke-width: 2.5; }

/* ── nav controls ────────────────────────────── */
.nav-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 520px;
}
.nav-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--pop);
  transition: transform .1s, box-shadow .1s;
  flex-shrink: 0;
}
.nav-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.nav-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }
.nav-btn svg { width: 15px; height: 15px; }

.know-btn {
  flex: 1;
  height: 42px;
  border-radius: 100px;
  border: 2px solid var(--ink);
  font-family: var(--ff-ui);
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: var(--pop);
  transition: transform .1s, box-shadow .1s, background .15s, color .15s;
  background: var(--paper);
  color: var(--ink);
}
.know-btn.known { background: var(--vert); color: white; border-color: var(--vert); }
.know-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.know-btn svg { width: 13px; height: 13px; }

/* ── dot nav ─────────────────────────────────── */
.dot-nav {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  max-width: 520px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--hair);
  cursor: pointer;
  transition: background .2s, transform .15s;
}
.dot.current { background: var(--ink); transform: scale(1.3); }
.dot.known-dot { background: var(--vert); }

/* ── empty ────────────────────────────────────── */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--soft);
  font-size: 0.9rem;
  text-align: center;
  padding: 40px 20px;
  gap: 8px;
}

/* ── shortcuts ────────────────────────────────── */
.shortcuts {
  text-align: center;
  font-size: 0.68rem;
  color: var(--hair);
  padding: 0 20px 14px;
}

/* ── animations ───────────────────────────────── */
@keyframes slideIn     { from { opacity:0; transform:translateX(28px)  } to { opacity:1; transform:none } }
@keyframes slideInBack { from { opacity:0; transform:translateX(-28px) } to { opacity:1; transform:none } }
.card.anim-fwd  { animation: slideIn .2s ease forwards; }
.card.anim-back { animation: slideInBack .2s ease forwards; }
@media (prefers-reduced-motion:reduce) { .card.anim-fwd,.card.anim-back { animation:none } }
</style>
</head>
<body>

<header class="header">
  <div class="wordmark">Écrire<span>.</span></div>
  <div class="section-toggle">
    <button id="btnA" class="active" onclick="setSection('A')">Section A</button>
    <button id="btnB" onclick="setSection('B')">Section B</button>
  </div>
</header>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="topics-scroller"><div class="topics-row" id="topicsRow"></div></div>
<div class="filter-bar">
  <div class="type-tabs">
    <button class="type-tab active" id="tabAll"    onclick="setFilter('all')">All</button>
    <button class="type-tab"        id="tabVocab"  onclick="setFilter('vocab')">Vocab</button>
    <button class="type-tab"        id="tabPhrase" onclick="setFilter('phrase')">Phrases</button>
  </div>

  </div>
</div>
<div class="card-area" id="cardArea"></div>
<p class="shortcuts">← → navigate &nbsp;·&nbsp; space = mark known &nbsp;·&nbsp; tap card for example</p>

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let section  = 'A';
let topicIdx = 0;
let cardIdx  = 0;
let filter   = 'all'; // 'all' | 'vocab' | 'phrase'
let expanded = false;
let known    = {};
try { known = JSON.parse(localStorage.getItem('ecrire_known') || '{}'); } catch(e){}
function saveKnown() { try { localStorage.setItem('ecrire_known', JSON.stringify(known)); } catch(e){} }

function currentTopics() { return TOPICS[section]; }
function currentTopic()  { return currentTopics()[topicIdx]; }
function allItems()      { return currentTopic().items; }
function filteredItems() {
  const all = allItems();
  if (filter === 'all') return all.map((item, i) => ({ item, origIdx: i }));
  return all.map((item, i) => ({ item, origIdx: i })).filter(({ item }) => item.type === filter);
}
function currentEntry()  { return filteredItems()[cardIdx]; }
function knownKey(topicId, origIdx) { return `${topicId}_${origIdx}`; }

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
function renderTopics() {
  const row = document.getElementById('topicsRow');
  row.innerHTML = '';
  currentTopics().forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-pill' + (i === topicIdx ? ' active' : '') + (t.light ? ' light' : '');
    btn.style.setProperty('--topic-color', t.color);
    btn.textContent = t.fr;
    btn.onclick = () => { topicIdx = i; cardIdx = 0; expanded = false; renderAll(); };
    row.appendChild(btn);
  });
}

function renderCard(direction) {
  const area  = document.getElementById('cardArea');
  const topic = currentTopic();
  const filt  = filteredItems();

  if (!filt.length) {
    area.innerHTML = `<div class="empty"><div style="font-size:2rem">🤷</div><div>No ${filter} items for this topic</div></div>`;
    document.getElementById('counterLabel').textContent = '0 / 0';
    document.getElementById('knownCount').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }

  const { item, origIdx } = filt[cardIdx];
  const ki  = knownKey(topic.id, origIdx);
  const isKn = !!known[ki];
  const knownCount = filt.filter(({ origIdx: oi }) => !!known[knownKey(topic.id, oi)]).length;

  document.getElementById('progressFill').style.width = (knownCount / filt.length * 100) + '%';
  document.getElementById('counterLabel').textContent = `${cardIdx + 1} / ${filt.length}`;
  document.getElementById('knownCount').textContent = knownCount > 0 ? `${knownCount} known ✓` : '';

  const isVocab = item.type === 'vocab';
  const badgeHtml = isVocab
    ? `<span class="card-type-badge badge-vocab">Vocab${item.wc ? ` · <em style="font-style:normal;opacity:.75">${item.wc}</em>` : ''}</span>`
    : `<span class="card-type-badge badge-phrase">Phrase</span>`;

  area.innerHTML = `
    <div class="card${direction ? ` anim-${direction}` : ''}"
         style="--topic-color:${topic.color}"
         onclick="toggleExpand()">
      <div class="card-accent"></div>
      <div class="card-body">
        <div class="known-badge${isKn ? ' show' : ''}">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1"/></svg>
        </div>
        ${badgeHtml}
        <div class="card-fr">${item.fr}</div>
        <div class="card-en">${item.en}</div>
        <div class="card-example${expanded ? ' open' : ''}">
          <div class="example-label">Exemple</div>
          <div class="example-fr">${item.ex}</div>
          <div class="example-en">${item.exEn}</div>
        </div>
      </div>
      <div class="tap-hint">${expanded ? '▲ close' : '▼ example'}</div>
    </div>

    <div class="nav-controls" style="--topic-color:${topic.color}">
      <button class="nav-btn" onclick="navigate(-1)" ${cardIdx === 0 ? 'disabled' : ''}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="10,3 5,8 10,13"/></svg>
      </button>
      <button class="know-btn${isKn ? ' known' : ''}" onclick="toggleKnown()">
        <svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="1,6 5,10 13,2"/></svg>
        ${isKn ? 'Marked known' : 'Mark as known'}
      </button>
      <button class="nav-btn" onclick="navigate(1)" ${cardIdx === filt.length - 1 ? 'disabled' : ''}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,3 11,8 6,13"/></svg>
      </button>
    </div>

    <div class="dot-nav">
      ${filt.map(({ origIdx: oi }, i) => {
        const kn = !!known[knownKey(topic.id, oi)];
        return `<div class="dot${i === cardIdx ? ' current' : ''}${kn ? ' known-dot' : ''}" onclick="jumpTo(${i})"></div>`;
      }).join('')}
    </div>
  `;
}

function renderAll(direction) {
  renderTopics();
  renderCard(direction);
  document.documentElement.style.setProperty('--accent', currentTopic().color);
  document.getElementById('btnA').classList.toggle('active', section === 'A');
  document.getElementById('btnB').classList.toggle('active', section === 'B');
  ['All','Vocab','Phrase'].forEach(t => {
    document.getElementById('tab'+t).classList.toggle('active', filter === t.toLowerCase());
  });
}

/* ═══════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════ */
function setSection(s) { section = s; topicIdx = 0; cardIdx = 0; expanded = false; renderAll(); }
function setFilter(f)  { filter = f; cardIdx = 0; expanded = false; renderAll(); }

function navigate(dir) {
  const len = filteredItems().length;
  const next = cardIdx + dir;
  if (next < 0 || next >= len) return;
  cardIdx = next; expanded = false;
  renderAll(dir === 1 ? 'fwd' : 'back');
}
function jumpTo(i) { cardIdx = i; expanded = false; renderAll(); }

function toggleKnown() {
  const { origIdx } = currentEntry();
  const ki = knownKey(currentTopic().id, origIdx);
  if (known[ki]) { delete known[ki]; } else { known[ki] = true; }
  saveKnown();
  renderCard();
  if (known[ki] && cardIdx < filteredItems().length - 1) {
    setTimeout(() => { cardIdx++; expanded = false; renderAll('fwd'); }, 380);
  }
}
function toggleExpand() { expanded = !expanded; renderCard(); }

/* ═══════════════════════════════════════════
   KEYBOARD + SWIPE
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === ' ')          { e.preventDefault(); toggleKnown(); }
  if (e.key === 'e' || e.key === 'E') toggleExpand();
});
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend',   e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1); }, { passive:true });

renderAll();
</script>
</body>
</html>
