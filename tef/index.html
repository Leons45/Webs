<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Atelier — français pour le TEF Canada</title>
<meta name="description" content="Programme quotidien A2 → B2 pour le TEF Canada : expression orale d'abord, phrases, grammaire et vocabulaire, avec l'anglais à côté.">
<meta name="theme-color" content="#F1F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="rail__mark">
      <b>L'Atelier</b>
      <i>A2 → B2 · TEF CANADA</i>
    </div>
    <nav class="rail__nav" id="nav" aria-label="Sections"></nav>
    <div class="rail__foot">
      <button class="assist" id="assist" aria-pressed="true" style="margin-bottom:.75rem">
        <span id="assistLabel">English on</span>
      </button>
      <a class="navitem" href="#/reglages">Réglages <span class="gloss gloss--inline">Settings</span></a>
      <button class="update-btn" id="updateBtn" title="Vérifier les mises à jour · v2026-11-10c" style="margin-top:.6rem">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span id="updateLabel">v2026-11-10c</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-head">
      <b>L'Atelier</b>
      <button class="assist" id="assistM" aria-pressed="true"><span id="assistLabelM">EN</span></button>
    </div>
    <div id="view" role="region" aria-live="polite"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
<script type="module">
// Update button — wired here so it shares the module scope cleanly.
document.getElementById('updateBtn').addEventListener('click', async () => {
  const btn = document.getElementById('updateBtn');
  const lbl = document.getElementById('updateLabel');
  btn.disabled = true;
  lbl.textContent = 'Mise à jour…';
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch {}
  window.location.reload();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {})
  );
}
</script>
</body>
</html>
