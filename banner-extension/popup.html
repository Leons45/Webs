<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon's Banner Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 380px;
    min-height: 500px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #f0f0f0;
  }

  .header {
    background: #FFC107;
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    font-size: 22px;
    font-weight: 900;
    color: #111;
    letter-spacing: -1px;
  }

  .header-sub {
    font-size: 11px;
    color: #333;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .body {
    padding: 14px 14px 0;
  }

  .section {
    margin-bottom: 14px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 6px;
  }

  .upload-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .upload-box {
    border: 2px dashed #333;
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: #1a1a1a;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .upload-box:hover { border-color: #FFC107; background: #1e1c10; }
  .upload-box.has-file { border-color: #4CAF50; border-style: solid; background: #111d11; }
  .upload-box.has-file:hover { border-color: #66BB6A; }

  .upload-box input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon { font-size: 20px; margin-bottom: 4px; }
  .upload-label { font-size: 11px; font-weight: 600; color: #aaa; }
  .upload-label.ok { color: #66BB6A; }
  .upload-name {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-thumb {
    width: 100%;
    max-height: 48px;
    object-fit: contain;
    margin-bottom: 4px;
    border-radius: 4px;
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .field.full { grid-column: 1 / -1; }

  .field label {
    font-size: 10px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field input, .field textarea {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    color: #f0f0f0;
    font-size: 12px;
    padding: 7px 9px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .field input:focus, .field textarea:focus { border-color: #FFC107; }

  .field textarea {
    resize: none;
    height: 46px;
  }

  .btn-generate {
    width: 100%;
    padding: 13px;
    background: #FFC107;
    color: #111;
    font-size: 14px;
    font-weight: 800;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn-generate:hover { background: #FFD54F; }
  .btn-generate:active { transform: scale(0.98); }
  .btn-generate:disabled { background: #444; color: #666; cursor: not-allowed; transform: none; }

  .status-bar {
    display: none;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    gap: 10px;
    align-items: center;
  }

  .status-bar.show { display: flex; }
  .status-bar.error { border-color: #f44; }
  .status-bar.success { border-color: #4CAF50; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #444;
    border-top-color: #FFC107;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  .status-bar.success .spinner { display: none; }
  .status-bar.error .spinner { border-top-color: #f44; }

  .status-text {
    font-size: 12px;
    color: #ccc;
    line-height: 1.4;
  }

  .status-bar.success .status-text { color: #66BB6A; }
  .status-bar.error .status-text { color: #ef5350; }

  .steps-track {
    display: none;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .steps-track.show { display: flex; }

  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #555;
    padding: 3px 0;
  }

  .step-item.active { color: #FFC107; }
  .step-item.done { color: #4CAF50; }

  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
  }

  .step-item.active .step-dot { background: #FFC107; box-shadow: 0 0 6px #FFC10780; }
  .step-item.done .step-dot { background: #4CAF50; }

  .divider {
    border: none;
    border-top: 1px solid #222;
    margin: 10px 0;
  }

  .footer {
    padding: 8px 14px 10px;
    font-size: 10px;
    color: #444;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">LEON'S</div>
    <div class="header-sub">Banner Builder</div>
  </div>
</div>

<div class="body">

  <!-- Upload Row -->
  <div class="section">
    <div class="section-label">📁 Upload Files</div>
    <div class="upload-row">
      <div class="upload-box" id="flyerBox">
        <input type="file" id="flyerInput" accept="image/*">
        <div class="upload-icon">🖼️</div>
        <div class="upload-label" id="flyerLabel">Flyer</div>
        <div class="upload-name" id="flyerName">Black Friday flyer</div>
      </div>
      <div class="upload-box" id="sampleBox">
        <input type="file" id="sampleInput" accept="image/*">
        <div class="upload-icon">📐</div>
        <div class="upload-label" id="sampleLabel">Sample Banner</div>
        <div class="upload-name" id="sampleName">Reference banner</div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- Banner Content -->
  <div class="section">
    <div class="section-label">📝 Banner Content</div>
    <div class="fields-grid">
      <div class="field full">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="e.g. Samsung 65&quot; QLED TV" />
      </div>
      <div class="field">
        <label>Sale Price</label>
        <input type="text" id="salePrice" placeholder="e.g. $1,299" />
      </div>
      <div class="field">
        <label>Save Amount</label>
        <input type="text" id="saveAmount" placeholder="e.g. Save $400" />
      </div>
      <div class="field">
        <label>% Off</label>
        <input type="text" id="pctOff" placeholder="e.g. 50%" />
      </div>
      <div class="field">
        <label>Campaign</label>
        <input type="text" id="campaign" placeholder="e.g. Black Friday" />
      </div>
      <div class="field">
        <label>Fin. Option</label>
        <input type="text" id="finOpt" placeholder="3 Years to Pay*" />
      </div>
      <div class="field full">
        <label>Fine Print</label>
        <input type="text" id="finePrint" placeholder="e.g. *See store for details" />
      </div>
    </div>
  </div>

  <!-- Steps Track -->
  <div class="steps-track" id="stepsTrack">
    <div class="step-item" id="step1"><div class="step-dot"></div> Opening ChatGPT…</div>
    <div class="step-item" id="step2"><div class="step-dot"></div> Uploading images…</div>
    <div class="step-item" id="step3"><div class="step-dot"></div> Sending prompt…</div>
    <div class="step-item" id="step4"><div class="step-dot"></div> Waiting for banner…</div>
    <div class="step-item" id="step5"><div class="step-dot"></div> Opening animator…</div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <div class="status-text" id="statusText">Starting…</div>
  </div>

  <!-- Generate Button -->
  <button class="btn-generate" id="btnGenerate">
    <span>⚡</span>
    <span id="btnText">Generate Banner</span>
  </button>

</div>

<div class="footer">Leon's Furniture · AI Banner Builder v1.0</div>

<script src="popup.js"></script>
</body>
</html>
