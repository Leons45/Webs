<!-- ═══════════ AURORA SKY ═══════════ -->
<script>
(function(){
  const cv=document.getElementById('sky-canvas');
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight}
  resize(); window.addEventListener('resize',resize);
  const gl=cv.getContext('webgl',{alpha:false}); if(!gl) return;
  const v=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const f=`precision highp float;
  uniform float T;uniform vec2 R;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.54);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.1+vec2(1.3,.7);a*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/R;
    vec3 sky=mix(vec3(.02,.05,.12),vec3(.01,.028,.085),uv.y*uv.y);
    float t=T*.028;
    vec2 q=vec2(fbm(uv*2.2+t),fbm(uv*2.2+1.+t*.9));
    vec2 r=vec2(fbm(uv*1.6+1.7*q+vec2(1.7,9.2)+t*.6),fbm(uv*1.6+1.7*q+vec2(8.3,2.8)+t*.5));
    float f2=fbm(uv*2.8+1.76*r);
    float band=smoothstep(.35,.72,uv.y+.08*sin(uv.x*3.+t*.4));
    float aurora=pow(f2*band,1.6);
    float m=smoothstep(0.,1.,fbm(uv*1.4+t*.3+3.));
    vec3 ac=mix(mix(vec3(0.,.28,.14),vec3(.12,0.,.22),m),vec3(0.,.08,.28),fbm(uv*2.+t*.2));
    float hg=pow(1.-uv.y,4.)*.18;
    vec3 col=sky+ac*aurora*.72+vec3(.14,.06,.02)*hg;
    gl_FragColor=vec4(clamp(col,0.,1.),1.);
  }`;
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,v));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,f));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  const uT=gl.getUniformLocation(prog,'T'),uR=gl.getUniformLocation(prog,'R');
  const noM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  let hid=false;
  document.addEventListener('visibilitychange',()=>{hid=document.hidden;});
  function frame(t){
    if(!hid){
      gl.viewport(0,0,cv.width,cv.height);
      gl.uniform1f(uT,noM?60.:t*.001);gl.uniform2f(uR,cv.width,cv.height);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

// ── WINDOW SHADER — creates a building face that draws its own window grid ──
function winShader(floors,cols,seed,baseColor){
  return new THREE.ShaderMaterial({
    uniforms:{
      uFloors:{value:floors},uCols:{value:cols},uSeed:{value:seed},
      uBase:{value:new THREE.Color(baseColor)},
      uMoon:{value:moon.position.clone().normalize()},
      uMoonC:{value:new THREE.Color(0xa0b8d8)},
      uAmb:{value:new THREE.Color(0x0d1835)},
    },
    vertexShader:`
      varying vec2 vUV;varying vec3 vWN,vWP;
      void main(){
        vUV=uv;
        vWN=normalize((modelMatrix*vec4(normal,0.)).xyz);
        vWP=(modelMatrix*vec4(position,1.)).xyz;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
      }`,
    fragmentShader:`
      precision mediump float;
      uniform float uFloors,uCols,uSeed;
      uniform vec3 uBase,uMoon,uMoonC,uAmb;
      varying vec2 vUV;varying vec3 vWN,vWP;
      float h22(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      void main(){
        vec2 g=vUV*vec2(uCols,uFloors);
        vec2 cell=floor(g);vec2 fr=fract(g);
        float bx=.14,by=.12;
        float isW=step(bx,fr.x)*step(bx,1.-fr.x)*step(by,fr.y)*step(by,1.-fr.y);
        float spand=1.-step(.11,fr.y); // spandrel band at floor line
        float rnd=h22(cell+uSeed);
        vec3 wc;
        if(rnd<.24) wc=vec3(1.,.75,.28)*1.8;       // warm lit
        else if(rnd<.37) wc=vec3(.28,.48,1.)*.75;  // cool/screen
        else wc=vec3(.012,.02,.06);                 // dark
        vec3 facade=uBase;
        vec3 frame=facade*.45;
        vec3 spandC=facade*.62;
        float ndl=max(dot(vWN,normalize(uMoon)),0.);
        vec3 lit=uAmb+uMoonC*ndl*.7;
        vec3 col;
        if(spand>.5) col=spandC*lit;
        else if(isW>.5) col=wc;
        else col=facade*lit;
        // Vignette toward edges for depth
        float vig=smoothstep(.0,.12,vUV.x)*smoothstep(.0,.12,1.-vUV.x);
        col*=(.82+.18*vig);
        gl_FragColor=vec4(col,1.);
      }`,
    side:THREE.FrontSide,
  });
}

function car(x,z,color,ry=0,headlightsOn=false){
  const g=new THREE.Group();

  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.85,.7,4.2),bMat);
  body.position.y=.55;g.add(body);
  // Cabin
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.6,.55,2.3),bMat);
  cab.position.set(0,1.1,.2);g.add(cab);
  // Windshield
  const wind=new THREE.Mesh(new THREE.BoxGeometry(1.5,.44,0.06),glassMat);
  wind.position.set(0,1.08,.97);wind.rotation.x=.22;g.add(wind);
  // Rear glass
  const rg=new THREE.Mesh(new THREE.BoxGeometry(1.5,.44,0.06),glassMat);
  rg.position.set(0,1.08,-.67);rg.rotation.x=-.22;g.add(rg);
  // Wheels (4)
  [[-.98,-1.3],[.98,-1.3],[-.98,1.3],[.98,1.3]].forEach(([wx,wz])=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.22,10),wMat);
    w.rotation.z=Math.PI/2;w.position.set(wx,.32,wz);g.add(w);
    // Hubcap
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.24,10),
      new THREE.MeshStandardMaterial({color:0x888888,roughness:.4,metalness:.8}));
    h.rotation.z=Math.PI/2;h.position.set(wx*.98,.32,wz);g.add(h);
  });
  // Hood detail
  box(.2,.04,1.1,new THREE.MeshStandardMaterial({color:0x888,roughness:.4,metalness:.8}),0,.92,1.4);
  if(headlightsOn){
    const hl=new THREE.PointLight(0xffeecc,2,12,2);
    hl.position.set(0,.7,2.2);g.add(hl);
  }
  g.rotation.y=ry;g.position.set(x,0,z);
  g.castShadow=true;
  scene.add(g);return g;
}

// ── HUMANOID CHARACTERS ───────────────────────────────────────────
function makeHuman({skin,hair,jacket,pants,scale=1,pose='stand'}){
  const g=new THREE.Group();
  const sMat=new THREE.MeshStandardMaterial({color:skin, roughness:.8});
  const jMat=new THREE.MeshStandardMaterial({color:jacket,roughness:.75});
  const pMat=new THREE.MeshStandardMaterial({color:pants, roughness:.85});
  const hMat=new THREE.MeshStandardMaterial({color:hair,  roughness:.9});
  const shMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.8});

  function part(w,h,d,mat){return new THREE.Mesh(new THREE.BoxGeometry(w*scale,h*scale,d*scale),mat);}

  if(pose==='sleep'){
    // Lying flat — rotate the whole group externally
    // Build standing, then rotate
    const torso=part(.44,.52,.22,jMat); torso.position.set(0,.78,0);g.add(torso);
    const head=part(.3,.3,.26,sMat); head.position.set(0,1.28,0);g.add(head);
    const hair2=part(.32,.12,.28,hMat); hair2.position.set(0,1.44,0);g.add(hair2);
    const lLeg=part(.17,.55,.16,pMat); lLeg.position.set(-.11,.29,0);g.add(lLeg);
    const rLeg=part(.17,.55,.16,pMat); rLeg.position.set(.11,.29,0);g.add(rLeg);
    const lArm=part(.13,.44,.13,jMat); lArm.position.set(-.29,.72,0);g.add(lArm);
    const rArm=part(.13,.44,.13,jMat); rArm.position.set(.29,.72,0);g.add(rArm);
    g.rotation.x=-Math.PI/2;
    return g;
  }

  if(pose==='sit'){
    // Seated — upper body up, lower legs forward
    const torso=part(.44,.52,.22,jMat); torso.position.set(0,.26,0);g.add(torso);
    const head=part(.3,.3,.26,sMat); head.position.set(0,.76,0);g.add(head);
    const hair2=part(.32,.12,.28,hMat); hair2.position.set(0,.92,0);g.add(hair2);
    // Upper legs flat
    const llUpper=part(.17,.44,.16,pMat); llUpper.rotation.x=Math.PI/2;llUpper.position.set(-.11,-.01,.2);g.add(llUpper);
    const rlUpper=part(.17,.44,.16,pMat); rlUpper.rotation.x=Math.PI/2;rlUpper.position.set(.11,-.01,.2);g.add(rlUpper);
    // Lower legs hang
    const llLower=part(.16,.38,.15,pMat); llLower.position.set(-.11,-.32,.4);g.add(llLower);
    const rlLower=part(.16,.38,.15,pMat); rlLower.position.set(.11,-.32,.4);g.add(rlLower);
    const lArm=part(.13,.44,.13,jMat); lArm.position.set(-.29,.22,0);lArm.rotation.z=.1;g.add(lArm);
    const rArm=part(.13,.44,.13,jMat); rArm.position.set(.29,.22,0);rArm.rotation.z=-.1;g.add(rArm);
    return g;
  }

  if(pose==='lean'){
    // Bent forward (Marcus under hood)
    const torso=part(.44,.52,.22,jMat); torso.rotation.x=1.1;torso.position.set(0,.55,.3);g.add(torso);
    const head=part(.3,.3,.26,sMat); head.position.set(0,.55,.92);g.add(head);
    const hair2=part(.32,.12,.28,hMat); hair2.position.set(0,.64,.94);g.add(hair2);
    const lLeg=part(.17,.58,.16,pMat); lLeg.position.set(-.11,.29,0);g.add(lLeg);
    const rLeg=part(.17,.58,.16,pMat); rLeg.position.set(.11,.29,0);g.add(rLeg);
    const lShoe=part(.18,.1,.26,shMat); lShoe.position.set(-.11,.05,.03);g.add(lShoe);
    const rShoe=part(.18,.1,.26,shMat); rShoe.position.set(.11,.05,.03);g.add(rShoe);
    // Arms reaching down into hood
    const lArm=part(.13,.52,.13,jMat); lArm.rotation.x=.9;lArm.position.set(-.26,.52,.55);g.add(lArm);
    const rArm=part(.13,.52,.13,jMat); rArm.rotation.x=.9;rArm.position.set(.26,.52,.55);g.add(rArm);
    return g;
  }

  // ── STAND (default) ──
  const lLeg =part(.17,.58,.16,pMat); lLeg.position.set(-.11,.29,0); g.add(lLeg);
  const rLeg =part(.17,.58,.16,pMat); rLeg.position.set(.11,.29,0);  g.add(rLeg);
  const lShoe=part(.18,.1,.26,shMat); lShoe.position.set(-.11,.05,.03); g.add(lShoe);
  const rShoe=part(.18,.1,.26,shMat); rShoe.position.set(.11,.05,.03);  g.add(rShoe);
  const torso=part(.44,.52,.22,jMat); torso.position.set(0,.86,0);  g.add(torso);
  const neck =part(.12,.14,.12,sMat); neck.position.set(0,1.17,0);  g.add(neck);
  const head =part(.30,.30,.26,sMat); head.position.set(0,1.38,0);  g.add(head);
  const hair2=part(.32,.13,.28,hMat); hair2.position.set(0,1.52,0); g.add(hair2);
  const lArm =part(.13,.44,.13,jMat); lArm.position.set(-.30,.82,0); lArm.rotation.z= .15; g.add(lArm);
  const rArm =part(.13,.44,.13,jMat); rArm.position.set(.30,.82,0);  rArm.rotation.z=-.15; g.add(rArm);
  return g;
}

function zoomToChar(idx){
  if(camState==='ZOOM_IN'||camState==='ZOOM_OUT') return;
  const ch=CHARS[idx];activeIdx=idx;
  zFrom.p.copy(camera.position);zFrom.t.copy(controls.target);
  zTo.p.copy(ch.camPos);zTo.t.copy(ch.camTgt);
  zoomT=0;camState='ZOOM_IN';controls.enabled=false;
  document.getElementById('sp-name').textContent    =ch.name;
  document.getElementById('sp-apt').textContent     =ch.apt;
  document.getElementById('sp-activity').textContent=ch.activity;
  document.getElementById('sp-beat').textContent    =ch.beat;
  document.getElementById('sp-dialogue').textContent=ch.dialogue;
  const dot=document.getElementById('sp-dot');
  dot.className='sp-dot'+(ch.status==='asleep'?' asleep':'');
  document.getElementById('story-panel').classList.add('visible');
  document.getElementById('controls-hint').style.opacity='0';
  document.querySelectorAll('.char-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
}
function zoomOut(){
  if(camState!=='CHAR') return;
  zFrom.p.copy(camera.position);zFrom.t.copy(controls.target);
  zTo.p.copy(CITY_POS);zTo.t.copy(CITY_TGT);
  zoomT=0;camState='ZOOM_OUT';
  document.getElementById('story-panel').classList.remove('visible');
  document.getElementById('controls-hint').style.opacity='.35';
  document.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('active'));
}

// ── Char panel UI ─────────────────────────────────────────────────
const panel=document.getElementById('char-panel');
CHARS.forEach((ch,i)=>{
  const btn=document.createElement('button');
  btn.className='char-btn';
  btn.innerHTML=`<div class="char-btn-info"><div class="char-btn-name">${ch.name}</div><div class="char-btn-role">${ch.apt}</div></div><div class="char-dot ${ch.status==='asleep'?'dot-asleep':'dot-active'}"></div>`;
  btn.addEventListener('click',()=>{
    if(camState==='CHAR'&&activeIdx!==i){zoomOut();setTimeout(()=>zoomToChar(i),750);}
    else if(camState==='CITY') zoomToChar(i);
  });
  panel.appendChild(btn);
});
document.getElementById('back-btn').addEventListener('click',zoomOut);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&camState!=='CITY')zoomOut();});

// ── Raycasting ────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2(-9,-9);
let hoveredIdx=-1;
renderer.domElement.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
});
renderer.domElement.addEventListener('click',()=>{
  if(camState!=='CITY') return;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(charBodyMeshes);
  if(hits.length){const idx=hits[0].object.userData.charIndex;if(idx!==undefined)zoomToChar(idx);}
});

// ── Resize ────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  composer.setSize(window.innerWidth,window.innerHeight);
  fxaa.material.uniforms['resolution'].value.set(1/(window.innerWidth*renderer.getPixelRatio()),1/(window.innerHeight*renderer.getPixelRatio()));
});

setLoad(98,'Waking the city');
setTimeout(()=>{
  document.getElementById('lf').style.width='100%';
  document.getElementById('ls').textContent='Welcome to North of Here';
  setTimeout(()=>document.getElementById('loader').classList.add('fade'),500);
},250);

// ── Render loop ───────────────────────────────────────────────────
const clock=new THREE.Clock();

renderer.setAnimationLoop((time)=>{
  const dt=clock.getDelta();
  const T=clock.getElapsedTime();

  // Camera anim
  if(camState==='ZOOM_IN'||camState==='ZOOM_OUT'){
    zoomT=Math.min(zoomT+dt*.52,1);
    const e=ease(zoomT);
    camera.position.lerpVectors(zFrom.p,zTo.p,e);
    controls.target.lerpVectors(zFrom.t,zTo.t,e);
    camera.lookAt(controls.target);
    if(zoomT>=1){
      if(camState==='ZOOM_IN'){camState='CHAR';}
      else{camState='CITY';controls.enabled=true;controls.target.copy(CITY_TGT);}
    }
  }
  controls.update();

  // Patrol paths
  CHARS.forEach((ch)=>{
    if(!ch.path||!ch.group) return;
    ch.pathT+=dt*.3;
    const seg=Math.floor(ch.pathT)%ch.path.length;
    const nxt=(seg+1)%ch.path.length;
    const t=ch.pathT%1;
    ch.group.position.lerpVectors(ch.path[seg],ch.path[nxt],t);
    const dir=new THREE.Vector3().subVectors(ch.path[nxt],ch.path[seg]);
    if(dir.length()>.01) ch.group.rotation.y=Math.atan2(dir.x,dir.z);
    // Update disc position
    const d=charDiscData[CHARS.indexOf(ch)];
    if(d) d.disc.position.set(ch.group.position.x,.03,ch.group.position.z);
  });

  // Stationary idle bob
  CHARS.forEach((ch,i)=>{
    if(!ch.path&&ch.group){
      ch.group.position.y=ch.pos.y+Math.sin(T*1.1+i)*.018;
    }
  });

  // Hover detection
  if(camState==='CITY'){
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(charBodyMeshes);
    const nh=hits.length?hits[0].object.userData.charIndex:-1;
    if(nh!==hoveredIdx){
      if(hoveredIdx>=0) charDiscData[hoveredIdx].mat.opacity=charDiscData[hoveredIdx].base;
      hoveredIdx=nh;
      renderer.domElement.style.cursor=nh>=0?'pointer':'default';
    }
  }

  // Disc pulse
  charDiscData.forEach((d,i)=>{
    d.mat.opacity=i===hoveredIdx?.5+.4*Math.sin(T*5):d.base+.1*Math.sin(T*2+i*1.4);
  });

  // Snow
  for(let i=0;i<SNOW_N;i++){
    const p=snowPos[i],v=snowVel[i];
    p.x+=v.x;p.y+=v.y;p.z+=v.z;
    if(p.y<-1){p.x=(Math.random()-.5)*140;p.y=58;p.z=(Math.random()-.5)*140;}
    dummy.position.copy(p);dummy.updateMatrix();snowMesh.setMatrixAt(i,dummy.matrix);
  }
  snowMesh.instanceMatrix.needsUpdate=true;

  composer.render();
});
</script>
