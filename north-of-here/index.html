<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North of Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; position: fixed; inset: 0; }
#sky-canvas  { z-index: 0; }
#three-canvas { z-index: 1; background: transparent !important; }

/* ── Show title top-left ── */
#show-title {
  position: fixed; top: 28px; left: 40px; z-index: 30; pointer-events: none;
}
.title-eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.5em;
  color: rgba(255,255,255,0.2); text-transform: uppercase; margin-bottom: 6px;
}
.title-line { width: 20px; height: 1px; background: rgba(255,255,255,0.15); }
.title-name {
  font-family: 'Cormorant Garamond', serif; font-size: 28px;
  font-weight: 300; color: rgba(255,255,255,0.75); letter-spacing: 0.08em;
}
.title-name em { font-style: italic; color: rgba(240,180,100,0.65); }
.title-sub {
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.35em;
  color: rgba(255,255,255,0.14); text-transform: uppercase; margin-top: 3px;
}

/* ── Episode badge top-right ── */
#ep-badge {
  position: fixed; top: 28px; right: 40px; z-index: 30;
  pointer-events: none; text-align: right;
}
.ep-eyebrow {
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.45em;
  color: rgba(255,255,255,0.18); text-transform: uppercase; margin-bottom: 2px;
}
.ep-title-sm {
  font-family: 'Cormorant Garamond', serif; font-size: 18px;
  font-weight: 300; color: rgba(255,255,255,0.35); letter-spacing: 0.06em;
}
.ep-title-sm em { font-style: italic; color: rgba(240,180,100,0.45); }
.ep-time {
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.28em;
  color: rgba(255,255,255,0.12); margin-top: 2px;
}

/* ── Character panel right side ── */
#char-panel {
  position: fixed; right: 0; top: 50%; transform: translateY(-50%);
  z-index: 30; display: flex; flex-direction: column;
}
.char-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px 10px 14px; cursor: pointer;
  border: none; background: transparent;
  border-right: 2px solid rgba(255,255,255,0.0);
  transition: all 0.25s; flex-direction: row-reverse;
}
.char-btn:hover { background: rgba(255,255,255,0.03); border-right-color: rgba(255,255,255,0.15); }
.char-btn.active { border-right-color: rgba(255,255,255,0.4); }
.char-btn-info { text-align: right; }
.char-btn-name {
  font-family: 'Inter', sans-serif; font-size: 10px;
  letter-spacing: 0.25em; color: rgba(255,255,255,0.35);
  text-transform: uppercase; transition: color 0.2s;
}
.char-btn:hover .char-btn-name,
.char-btn.active .char-btn-name { color: rgba(255,255,255,0.85); }
.char-btn-role {
  font-family: 'Inter', sans-serif; font-size: 8px;
  color: rgba(255,255,255,0.14); letter-spacing: 0.08em; margin-top: 1px;
}
.char-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dot-active { background: #f0a060; box-shadow: 0 0 7px #f0a060; }
.dot-asleep { background: rgba(80,80,120,0.5); }

/* ── Controls hint bottom-centre ── */
#controls-hint {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; gap: 16px; pointer-events: none;
  opacity: 0.4; transition: opacity 0.4s;
}
.hint-pill {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 20px; padding: 6px 14px;
  font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.28em;
  color: rgba(255,255,255,0.5); text-transform: uppercase;
}

/* ── Story panel slides from bottom ── */
#story-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  padding: 70px 60px 42px;
  background: linear-gradient(to top,
    rgba(0,0,0,0.94) 0%,
    rgba(0,0,0,0.6) 65%,
    rgba(0,0,0,0.0) 100%
  );
  transform: translateY(100%);
  transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
#story-panel.visible { transform: translateY(0); pointer-events: auto; }

.sp-name {
  font-family: 'Cormorant Garamond', serif; font-size: 52px;
  font-weight: 300; color: rgba(255,255,255,0.9); letter-spacing: 0.04em;
  line-height: 1;
}
.sp-apt {
  font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.4em;
  color: rgba(255,255,255,0.22); text-transform: uppercase; margin-top: 5px;
}
.sp-divider {
  width: 36px; height: 1px; background: rgba(255,255,255,0.12); margin: 16px 0;
}
.sp-activity {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.sp-dot {
  width: 5px; height: 5px; border-radius: 50%; background: #f0a060;
  box-shadow: 0 0 8px #f0a060; animation: pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
.sp-dot.asleep { background: rgba(100,100,180,0.6); box-shadow: none; animation: none; }
.sp-activity-text {
  font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.3em;
  color: rgba(255,255,255,0.35); text-transform: uppercase;
}
.sp-beat {
  font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.9;
  color: rgba(255,255,255,0.28); max-width: 440px; letter-spacing: 0.02em;
  margin-bottom: 14px;
}
.sp-dialogue {
  font-family: 'Cormorant Garamond', serif; font-size: 22px;
  font-style: italic; font-weight: 300;
  color: rgba(240,180,100,0.6); letter-spacing: 0.02em;
}
#back-btn {
  position: absolute; bottom: 42px; right: 60px;
  font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.35em;
  color: rgba(255,255,255,0.3); text-transform: uppercase;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  border: none; background: transparent; transition: color 0.2s;
}
#back-btn:hover { color: rgba(255,255,255,0.7); }
#back-btn::before { content: '←'; font-size: 12px; }

/* ── Vignette ── */
.vignette {
  position: fixed; inset: 0; z-index: 14;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
}

/* ── Loader ── */
#loader {
  position: fixed; inset: 0; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; transition: opacity 2s ease;
}
#loader.fade { opacity: 0; pointer-events: none; }
.loader-eyebrow {
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.6em;
  color: rgba(255,255,255,0.15); text-transform: uppercase; margin-bottom: 20px;
}
.loader-title {
  font-family: 'Cormorant Garamond', serif; font-size: 60px;
  font-weight: 300; color: #fff; letter-spacing: 0.2em; text-transform: uppercase;
}
.loader-title em { font-style: italic; color: rgba(240,180,100,0.7); }
.loader-sub {
  font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.5em;
  color: rgba(255,255,255,0.14); text-transform: uppercase;
  margin-top: 8px; margin-bottom: 60px;

.loader-bar { width: 180px; height: 1px; background: rgba(255,255,255,0.07); }
.loader-fill { height: 100%; background: rgba(255,255,255,0.3); width: 0%; transition: width 0.4s ease; }
.loader-status {
  font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 0.35em;
  color: rgba(255,255,255,0.11); text-transform: uppercase; margin-top: 16px; min-height: 14px;
}
</style>

<!-- ═══════════════════════ AURORA SKY SHADER ═══════════════════════ -->
<script>
(function(){
  const cv = document.getElementById('sky-canvas');
  function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const gl = cv.getContext('webgl', { alpha: false });
  if (!gl) return;

  const vert = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
  const frag = `
    precision highp float;
    uniform float T; uniform vec2 R;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.54);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.1+vec2(1.3,.7);a*=.5;}return v;}
    void main(){
      vec2 uv=gl_FragCoord.xy/R;
      vec3 sky=mix(vec3(.025,.055,.13),vec3(.012,.030,.090),uv.y*uv.y);
      float t=T*.028;
      vec2 q=vec2(fbm(uv*2.2+t),fbm(uv*2.2+1.+t*.9));
      vec2 r=vec2(fbm(uv*1.6+1.7*q+vec2(1.7,9.2)+t*.6),fbm(uv*1.6+1.7*q+vec2(8.3,2.8)+t*.5));
      float f=fbm(uv*2.8+1.76*r);
      float band=smoothstep(.35,.72,uv.y+.08*sin(uv.x*3.+t*.4));
      float aurora=pow(f*band,1.6);
      float m=smoothstep(0.,1.,fbm(uv*1.4+t*.3+3.));
      vec3 ac=mix(mix(vec3(0.,.28,.14),vec3(.12,0.,.22),m),vec3(0.,.08,.28),fbm(uv*2.+t*.2));
      float hg=pow(1.-uv.y,4.)*.18;
      vec3 col=sky+ac*aurora*.72+vec3(.14,.06,.02)*hg;
      gl_FragColor=vec4(clamp(col,0.,1.),1.);
    }`;

  function mkSh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,mkSh(gl.VERTEX_SHADER,vert));
  gl.attachShader(prog,mkSh(gl.FRAGMENT_SHADER,frag));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  const uT=gl.getUniformLocation(prog,'T'), uR=gl.getUniformLocation(prog,'R');
  const noM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  let hidden=false;
  document.addEventListener('visibilitychange',()=>{hidden=document.hidden;});
  function frame(t){
    if(!hidden){
      gl.viewport(0,0,cv.width,cv.height);
      gl.uniform1f(uT,noM?60.:t*.001); gl.uniform2f(uR,cv.width,cv.height);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script type="module">
import * as THREE from 'three';

// ── Loader helpers ──────────────────────────────────────────────────
const setLoad = (p, m) => {
  document.getElementById('lf').style.width = p + '%';
  document.getElementById('ls').textContent  = m;
};

// ── Renderer ────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({
  antialias: false, powerPreference: 'high-performance', alpha: true
});
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
renderer.outputColorSpace    = THREE.SRGBColorSpace;
renderer.domElement.id = 'three-canvas';
document.body.insertBefore(renderer.domElement, document.getElementById('loader'));

setLoad(5, 'Building the neighbourhood');

// ── Scene ───────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060c18, 0.006);

// ── Camera ──────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 50, 55);
camera.lookAt(0, 8, 0);

// ── OrbitControls ───────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.minDistance      = 6;
controls.maxDistance      = 110;
controls.maxPolarAngle    = Math.PI * 0.46;
controls.update();

// ── Character stories ────────────────────────────────────────────────
// City coordinate system:
//   Z+ = south (toward camera default)
//   Z- = north (away from camera)
//   Main building: front face z=+3, back face z=-3
//   Street: z=+8 to z=+18
//   Tim Hortons: z=+24

const CHARS = [
  {
    id: 'priya', name: 'Priya', apt: 'Apt 4B · 4th Floor',
    color: 0xe8906a,
    pos:    new THREE.Vector3(-2.5, 12.6, 3.5),   // front face, floor 4

  },
  {

    camPos: new THREE.Vector3(5, 7, -3),
    camTgt: new THREE.Vector3(5, 0.9, -14),
    status: 'active',
    activity: 'Under the hood — won\'t start',
    beat: 'Job interview at 9am downtown. It\'s 2:34am. He\'s been out here 40 minutes. His hands are numb. The Civic won\'t start.',
    dialogue: '"Come on, come on..."',
    path: [
      new THREE.Vector3(5, 0.9, -13),

// ── City geometry helpers ────────────────────────────────────────────
function box(w, h, d, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if(shadow){ m.castShadow = true; m.receiveShadow = true; }
  scene.add(m);
  return m;
}

setLoad(12, 'Paving streets and sidewalks');

const matSnow     = new THREE.MeshStandardMaterial({ color: 0xc8d8e8, roughness: 0.95 });
const matStreet   = new THREE.MeshStandardMaterial({ color: 0x181c24, roughness: 0.9 });
const matSidewalk = new THREE.MeshStandardMaterial({ color: 0x252934, roughness: 0.88 });

// ── Materials ────────────────────────────────────────────────────────
const matConc   = new THREE.MeshStandardMaterial({ color: 0x3c4255, roughness: 0.9 });
const matDkConc = new THREE.MeshStandardMaterial({ color: 0x2a2e3e, roughness: 0.88 });
const matWinWrm = new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xffaa22, emissiveIntensity: 1.1, roughness: 0.5 });
const matWinBlue= new THREE.MeshStandardMaterial({ color: 0x112299, emissive: 0x081460, emissiveIntensity: 0.7, roughness: 0.5 });
const matWinDrk = new THREE.MeshStandardMaterial({ color: 0x060a14, roughness: 0.9 });

// ── Main apartment building ───────────────────────────────────────────
{
  const W=17, D=6, H=27, floors=9;
  const fH = H / floors;

  box(W, H, D, matConc, 0, H/2, 0);

  // Window grid — both faces
  for(let f=0; f<floors; f++){
    for(let w=0; w<5; w++){
      const wx = -W/2 + 1.8 + w * (W-3.6)/4;
      const wy = fH/2 + f*fH + 0.5;
      let fm = matWinDrk;
      const r = Math.random();
      if(f===3 && w===1) fm = matWinWrm;        // Priya's window
      else if(f===5 && w===3) fm = matWinBlue;  // Sophie (TV blue)
      else if(r < 0.28) fm = matWinWrm;
      else if(r < 0.42) fm = matWinBlue;

      // Front face windows (z = D/2)
      const wf = new THREE.Mesh(new THREE.BoxGeometry(1.4, fH*0.6, 0.12), fm);
      wf.position.set(wx, wy, D/2 + 0.06);
      scene.add(wf);

      // Rear face windows
      const wr = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, fH*0.6, 0.12),
        Math.random() < 0.25 ? matWinWrm : matWinDrk
      );
      wr.position.set(wx, wy, -D/2 - 0.06);
      scene.add(wr);
    }
  }

  // Lobby glow (front)
  const lobby = new THREE.Mesh(
    new THREE.BoxGeometry(5, 2.8, 0.1),
    new THREE.MeshStandardMaterial({ color: 0xffbb44, emissive: 0xffaa22, emissiveIntensity: 1.6, roughness: 0.5 })
  );

  // Rooftop — water tower, HVAC
  box(3, 3.5, 2, matDkConc, 4, H+1.75, 0);
  box(2, 1.2, 2, matDkConc, -3, H+0.6, 0);
  box(1.8, 1, 1.8, matDkConc, 1, H+0.5, 1);

  // Balconies
  for(let f=1; f<floors; f++){
    [-5, 0, 5].forEach(bx => {
      box(2.5, 0.15, 1.3, matDkConc, bx, f*fH, D/2 + 0.65);
    });
  }
}

// ── Generic building factory ──────────────────────────────────────────
function addBuilding(x, z, w, h, d, floors, color){
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  box(w, h, d, mat, x, h/2, z);
  const fH = h/floors;
  const cols = Math.round(w / 3.4);
  for(let f=0; f<floors; f++){
    for(let c=0; c<cols; c++){
      const wx = x - w/2 + 1.6 + c * (w-3.2)/Math.max(cols-1,1);
      if(Math.abs(wx - x) > w/2 - 0.8) continue;
      const wy = fH/2 + f*fH + 0.3;
      const r = Math.random();
      let wm = r<0.22 ? matWinWrm : r<0.34 ? matWinBlue : matWinDrk;
      const wn = new THREE.Mesh(new THREE.BoxGeometry(1.2, fH*0.55, 0.1), wm);
      wn.position.set(wx, wy, z + d/2 + 0.06);
      scene.add(wn);
    }
  }
}

// ── Camera state machine ──────────────────────────────────────────────
let camState = 'CITY';  // CITY | ZOOM_IN | CHAR | ZOOM_OUT
let activeIdx = -1;
let zoomT = 0;
const CITY_POS = new THREE.Vector3(0, 50, 55);
const CITY_TGT = new THREE.Vector3(0, 8,  0);
const zFrom = { p: new THREE.Vector3(), t: new THREE.Vector3() };
const zTo   = { p: new THREE.Vector3(), t: new THREE.Vector3() };

function ease(t){ return t<.5 ? 2*t*t : -1+(4-2*t)*t; }

function zoomToChar(idx){
  if(camState==='ZOOM_IN'||camState==='ZOOM_OUT') return;
  const ch = CHARS[idx];
  activeIdx = idx;
  zFrom.p.copy(camera.position);
  zFrom.t.copy(controls.target);
  zTo.p.copy(ch.camPos);
  zTo.t.copy(ch.camTgt);
  zoomT = 0;
  camState = 'ZOOM_IN';
  controls.enabled = false;

  // Populate story panel
  document.getElementById('sp-name').textContent     = ch.name;
  document.getElementById('sp-apt').textContent      = ch.apt;
  document.getElementById('sp-activity').textContent = ch.activity;
  document.getElementById('sp-beat').textContent     = ch.beat;
  document.getElementById('sp-dialogue').textContent = ch.dialogue;
  const dot = document.getElementById('sp-dot');
  dot.className = 'sp-dot' + (ch.status==='asleep' ? ' asleep' : '');
  document.getElementById('story-panel').classList.add('visible');
  document.getElementById('controls-hint').style.opacity = '0';
  document.querySelectorAll('.char-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
}

function zoomOut(){
  if(camState!=='CHAR') return;
  zFrom.p.copy(camera.position);
  zFrom.t.copy(controls.target);
  zTo.p.copy(CITY_POS);
  zTo.t.copy(CITY_TGT);
  zoomT = 0;
  camState = 'ZOOM_OUT';
  document.getElementById('story-panel').classList.remove('visible');
  document.getElementById('controls-hint').style.opacity = '0.4';
  document.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('active'));
}

// ── Raycasting ────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-9, -9);
let hoveredIdx = -1;

renderer.domElement.addEventListener('mousemove', e=>{
  mouse.x =  (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
});

renderer.domElement.addEventListener('click', ()=>{
  if(camState!=='CITY') return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(charBodyMeshes);
  if(hits.length){
    const idx = hits[0].object.userData.charIndex;
    if(idx !== undefined) zoomToChar(idx);
  }
});

// ── Resize ────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaa.material.uniforms['resolution'].value.set(
    1/(window.innerWidth*renderer.getPixelRatio()),
    1/(window.innerHeight*renderer.getPixelRatio())
  );
});

setLoad(97, 'Waking the city');

setTimeout(()=>{
  document.getElementById('lf').style.width = '100%';
  document.getElementById('ls').textContent = 'Welcome to North of Here';
  setTimeout(()=>document.getElementById('loader').classList.add('fade'), 500);
}, 300);

// ── Render loop ───────────────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop((time)=>{
  const dt = clock.getDelta();
  const T  = clock.getElapsedTime();

  // Camera animation
  if(camState==='ZOOM_IN' || camState==='ZOOM_OUT'){
    zoomT = Math.min(zoomT + dt * 0.55, 1);
    const e = ease(zoomT);
    camera.position.lerpVectors(zFrom.p, zTo.p, e);
    controls.target.lerpVectors(zFrom.t, zTo.t, e);
    camera.lookAt(controls.target);
    if(zoomT >= 1){
      if(camState==='ZOOM_IN'){ camState='CHAR'; }
      else { camState='CITY'; controls.enabled=true; controls.target.copy(CITY_TGT); }
    }
  }
  controls.update();

  // Character movement along paths
  CHARS.forEach((ch, i)=>{
    if(!ch.path || !ch.group) return;
    ch.pathT += dt * 0.28;
    const seg = Math.floor(ch.pathT) % ch.path.length;
    const nxt = (seg+1) % ch.path.length;
    const t   = ch.pathT % 1;
    ch.group.position.lerpVectors(ch.path[seg], ch.path[nxt], t);
    const dir = new THREE.Vector3().subVectors(ch.path[nxt], ch.path[seg]);
    if(dir.length() > 0.01) ch.group.rotation.y = Math.atan2(dir.x, dir.z);
  });

  // Stationary idle bob
  CHARS.forEach((ch, i)=>{
    if(!ch.path && ch.group){
      ch.group.position.y = ch.pos.y + Math.sin(T*1.1 + i) * 0.025;
    }
  });

  // Hover detection
  if(camState==='CITY'){
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(charBodyMeshes);
    const nh = hits.length ? hits[0].object.userData.charIndex : -1;
    if(nh !== hoveredIdx){
      if(hoveredIdx >= 0) charDiscData[hoveredIdx].mat.opacity = charDiscData[hoveredIdx].base;
      hoveredIdx = nh;
      renderer.domElement.style.cursor = nh >= 0 ? 'pointer' : 'default';
    }
  }

  // Disc pulse
  charDiscData.forEach((d, i)=>{
    d.mat.opacity = i===hoveredIdx
      ? 0.5 + 0.4*Math.sin(T*5)
      : d.base + 0.12*Math.sin(T*2 + i*1.3);
  });

  // Snow
  for(let i=0; i<SNOW_N; i++){
    const p=snowPos[i], v=snowVel[i];
    p.x+=v.x; p.y+=v.y; p.z+=v.z;
    if(p.y < -1){
      p.x=(Math.random()-.5)*120; p.y=55; p.z=(Math.random()-.5)*120;
    }
    dummy.position.copy(p); dummy.updateMatrix();
    snowMesh.setMatrixAt(i, dummy.matrix);
  }
  snowMesh.instanceMatrix.needsUpdate = true;

  composer.render();
});
