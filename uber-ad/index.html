<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Move With Uber — Concept Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="stage">

  <!-- 1: Problem — 0.0-1.4s -->
  <section class="scene" id="s1">
    <svg class="icon icon-clock" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="6"/>
      <line id="clock-min" x1="60" y1="60" x2="60" y2="24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <line id="clock-hr" x1="60" y1="60" x2="84" y2="60" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <p class="punch" id="t1">Need a ride?</p>
  </section>

  <!-- 2: Brand smash — 1.4-2.8s -->
  <section class="scene" id="s2">
    <h1 class="wordmark" id="wordmark">Uber</h1>
  </section>

  <!-- 3: Tap — 2.8-4.2s -->
  <section class="scene" id="s3">
    <div class="tap-wrap">
      <svg class="icon icon-tap" viewBox="0 0 120 120">
        <circle id="ripple1" cx="60" cy="60" r="10" fill="none" stroke="var(--accent)" stroke-width="4"/>
        <circle id="ripple2" cx="60" cy="60" r="10" fill="none" stroke="var(--accent)" stroke-width="4"/>
        <circle cx="60" cy="60" r="12" fill="#fff"/>
      </svg>
    </div>
    <p class="punch">Tap.</p>
  </section>

  <!-- 4: Car arrives — 4.2-5.6s -->
  <section class="scene" id="s4">
    <svg class="icon icon-car" viewBox="0 0 220 100">
      <g id="speedlines">
        <line x1="0" y1="35" x2="40" y2="35" stroke="#fff" stroke-width="4" opacity="0.5"/>
        <line x1="0" y1="50" x2="30" y2="50" stroke="#fff" stroke-width="4" opacity="0.5"/>
        <line x1="0" y1="65" x2="45" y2="65" stroke="#fff" stroke-width="4" opacity="0.5"/>
      </g>
      <g id="car-body" transform="translate(-260,0)">
        <path d="M30 70 L40 45 Q48 35 60 35 L140 35 Q152 35 160 45 L170 70 Z" fill="var(--accent)"/>
        <rect x="60" y="40" width="70" height="22" rx="6" fill="#000"/>
        <circle cx="60" cy="72" r="14" fill="#111" stroke="#fff" stroke-width="3"/>
        <circle cx="150" cy="72" r="14" fill="#111" stroke="#fff" stroke-width="3"/>
      </g>
    </svg>
    <p class="punch">It shows up.</p>
  </section>

  <!-- 5: Pin + route — 5.6-7.0s -->
  <section class="scene" id="s5">
    <svg class="icon icon-route" viewBox="0 0 300 160">
      <path id="route-path" d="M20 130 C 80 130, 100 40, 160 40 S 250 110, 280 60"
        fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500"/>
      <g id="pin" transform="translate(280,30) scale(0)">
        <path d="M0 0 C -14 0 -24 10 -24 24 C -24 42 0 60 0 60 C 0 60 24 42 24 24 C 24 10 14 0 0 0 Z" fill="#fff"/>
        <circle cx="0" cy="22" r="8" fill="var(--accent)"/>
      </g>
    </svg>
    <p class="punch">Track it live.</p>
  </section>

  <!-- 6/7/8: word slams — 7.0-10.0s -->
  <section class="scene" id="s6"><p class="slam">Fast.</p></section>
  <section class="scene" id="s7"><p class="slam">Safe.</p></section>
  <section class="scene" id="s8"><p class="slam">Easy.</p></section>

  <!-- 9: feature — pricing — 10.0-11.6s -->
  <section class="scene" id="s9">
    <svg class="icon icon-feature" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="5"/>
      <text x="50" y="66" text-anchor="middle" font-size="44" font-weight="900" fill="#fff">$</text>
    </svg>
    <p class="feature-label">Upfront pricing</p>
  </section>

  <!-- 10: feature — tracking — 11.6-13.2s -->
  <section class="scene" id="s10">
    <svg class="icon icon-feature" viewBox="0 0 100 100">
      <circle id="radar1" cx="50" cy="50" r="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
      <circle id="radar2" cx="50" cy="50" r="10" fill="none" stroke="var(--accent)" stroke-width="3"/>
      <circle cx="50" cy="50" r="8" fill="#fff"/>
    </svg>
    <p class="feature-label">Live tracking</p>
  </section>

  <!-- 11: feature — rating — 13.2-14.8s -->
  <section class="scene" id="s11">
    <div class="stars">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
    <p class="feature-label">Rated drivers</p>
  </section>

  <!-- 12: city drive — 14.8-19.0s -->
  <section class="scene" id="s12">
    <svg class="icon icon-city" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice">
      <g id="skyline" fill="#141414">
        <rect x="0" y="70" width="40" height="90"/>
        <rect x="45" y="40" width="34" height="120"/>
        <rect x="84" y="90" width="30" height="70"/>
        <rect x="120" y="20" width="38" height="140"/>
        <rect x="164" y="60" width="30" height="100"/>
        <rect x="200" y="85" width="40" height="75"/>
        <rect x="246" y="35" width="34" height="125"/>
        <rect x="286" y="70" width="30" height="90"/>
        <rect x="322" y="50" width="38" height="110"/>
        <rect x="366" y="95" width="34" height="65"/>
      </g>
      <g id="city-car" transform="translate(-100,120)">
        <path d="M0 24 L8 6 Q14 0 24 0 L70 0 Q80 0 86 6 L94 24 Z" fill="var(--accent)"/>
        <rect x="24" y="2" width="38" height="14" rx="4" fill="#000"/>
        <circle cx="20" cy="26" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
        <circle cx="76" cy="26" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
      </g>
    </svg>
    <p class="punch city-caption">Go anywhere in the city.</p>
  </section>

  <!-- 13: arrival burst — 19.0-21.0s -->
  <section class="scene" id="s13">
    <svg class="icon icon-check" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" stroke-width="6"/>
      <path id="check-path" d="M36 62 L52 78 L86 42" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80"/>
    </svg>
    <p class="punch">You've arrived.</p>
  </section>

  <!-- 14: headline — 21.0-25.0s -->
  <section class="scene" id="s14">
    <h2 class="cta-headline">Go anywhere.</h2>
  </section>

  <!-- 15: CTA — 25.0-30.0s -->
  <section class="scene" id="s15">
    <div class="confetti" id="confetti"></div>
    <span class="cta-wordmark">Uber</span>
    <button class="cta-btn">Get the app</button>
  </section>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="flash" id="flash"></div>
  <button id="replay-btn" aria-label="Replay">↻ Replay</button>
</main>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js"></script>
<script src="script.js"></script>
</body>
</html>
