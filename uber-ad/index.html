<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Move With Uber — Concept Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="stage">

  <!-- Scene 1: Brand intro (0-5s) -->
  <section class="scene" id="scene-1">
    <div class="bg-sweep"></div>
    <h1 class="wordmark" id="wordmark">Uber</h1>
  </section>

  <!-- Scene 2: Kinetic value prop (5-15s) -->
  <section class="scene" id="scene-2">
    <p class="line line-a">Tap a button.</p>
    <p class="line line-b">A ride shows up.</p>
    <p class="line line-c">That's it.</p>
  </section>

  <!-- Scene 3: Feature beats (15-25s) -->
  <section class="scene" id="scene-3">
    <div class="feature-grid">
      <div class="feature" data-idx="1">
        <span class="feature-num">01</span>
        <span class="feature-title">Upfront pricing</span>
      </div>
      <div class="feature" data-idx="2">
        <span class="feature-num">02</span>
        <span class="feature-title">Live tracking</span>
      </div>
      <div class="feature" data-idx="3">
        <span class="feature-num">03</span>
        <span class="feature-title">Rated drivers</span>
      </div>
    </div>
    <svg class="route-line" viewBox="0 0 800 200" preserveAspectRatio="none">
      <path id="route-path" d="M 0 160 C 200 160, 250 40, 400 40 S 600 160, 800 100"
        fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round"/>
      <defs>
        <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--accent)"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <circle id="route-dot" r="6" fill="#fff"/>
    </svg>
  </section>

  <!-- Scene 4: CTA end frame (25-30s) -->
  <section class="scene" id="scene-4">
    <h2 class="cta-headline">Go anywhere.</h2>
    <div class="cta-row">
      <span class="cta-wordmark">Uber</span>
      <button class="cta-btn">Get the app</button>
    </div>
  </section>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <button id="replay-btn" aria-label="Replay">↻ Replay</button>
</main>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js"></script>
<script src="https://unpkg.com/split-type@0.3.4/umd/index.js"></script>
<script src="script.js"></script>
</body>
</html>
