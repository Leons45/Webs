<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Day, Your Way — Uber Concept Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- persistent cinematic frame: never cuts, holds the whole film together -->
<div class="bg-glow" id="bg-glow"></div>
<div class="grain"></div>
<div class="letterbox letterbox-top"></div>
<div class="letterbox letterbox-bottom"></div>

<main id="stage">

  <!-- 00 — HOOK: stuck, needs to go (0.0 - 3.2s) -->
  <section class="scene" id="s0">
    <svg class="icon icon-clock" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <circle id="clock-arc" cx="60" cy="60" r="44" fill="none" stroke="var(--accent)" stroke-width="3"
        stroke-dasharray="276" stroke-dashoffset="276" stroke-linecap="round" transform="rotate(-90 60 60)"/>
      <line id="clock-min" x1="60" y1="60" x2="60" y2="26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line id="clock-hr" x1="60" y1="60" x2="82" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="eyebrow" id="e0">7:48 AM — running late</p>
    <h2 class="line-xl" id="h0">You need to be<br/>somewhere.</h2>
  </section>

  <!-- 01 — OPEN THE APP: ask where to (3.2 - 7.0s) -->
  <section class="scene" id="s1">
    <div class="phone-card">
      <div class="phone-notch"></div>
      <span class="uber-mini">Uber</span>
      <div class="input-row">
        <svg viewBox="0 0 24 24" class="pin-mini"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7z"/></svg>
        <span class="type-text" id="type-text"></span>
        <span class="caret"></span>
      </div>
      <div class="request-btn" id="request-btn">Request</div>
    </div>
  </section>

  <!-- 02 — MATCHED: nearest driver found (7.0 - 11.4s) -->
  <section class="scene" id="s2">
    <div class="radar-wrap">
      <svg class="radar" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="90" class="radar-ring" />
        <circle cx="110" cy="110" r="60" class="radar-ring" />
        <circle cx="110" cy="110" r="30" class="radar-ring" />
        <g id="radar-sweep">
          <path d="M110 110 L110 20 A90 90 0 0 1 176 56 Z" fill="url(#sweepGrad)"/>
        </g>
        <defs>
          <linearGradient id="sweepGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.55"/>
          </linearGradient>
        </defs>
        <g id="found-car" transform="translate(110,110) scale(0)">
          <path d="M-18 6 L-13 -6 Q-9 -11 -1 -11 L13 -11 Q21 -11 25 -6 L30 6 Z" fill="var(--accent)"/>
          <circle cx="-10" cy="9" r="5" fill="#0a0a0a" stroke="#fff" stroke-width="1.5"/>
          <circle cx="20" cy="9" r="5" fill="#0a0a0a" stroke="#fff" stroke-width="1.5"/>
        </g>
      </svg>
    </div>
    <p class="eyebrow" id="match-label">Finding your driver…</p>
    <div class="driver-card" id="driver-card">
      <div class="driver-avatar"></div>
      <div class="driver-meta">
        <span class="driver-name">Marcus · Toyota Camry</span>
        <span class="driver-rating">★★★★★ 4.98</span>
      </div>
      <span class="driver-plate">CXJ 204</span>
    </div>
  </section>

  <!-- 03 — LIVE TRACKING: driver en route (11.4 - 15.8s) -->
  <section class="scene" id="s3">
    <svg class="icon icon-route" viewBox="0 0 320 180">
      <path id="route-path" d="M24 150 C 90 150, 110 50, 170 50 S 270 120, 296 60"
        fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520"/>
      <g id="pin" transform="translate(24,150) scale(0)">
        <path d="M0 -4 C -11 -4 -19 4 -19 15 C -19 30 0 46 0 46 C 0 46 19 30 19 15 C 19 4 11 -4 0 -4 Z" fill="#fff"/>
        <circle cx="0" cy="14" r="6" fill="var(--accent)"/>
      </g>
      <g id="eta-car" transform="translate(296,60) scale(0)">
        <path d="M-16 5 L-11 -5 Q-8 -9 -1 -9 L11 -9 Q18 -9 22 -5 L27 5 Z" fill="var(--accent)"/>
        <circle cx="-9" cy="8" r="4.5" fill="#0a0a0a" stroke="#fff" stroke-width="1.3"/>
        <circle cx="18" cy="8" r="4.5" fill="#0a0a0a" stroke="#fff" stroke-width="1.3"/>
      </g>
    </svg>
    <p class="eyebrow">Arriving in</p>
    <h3 class="eta-number"><span id="eta-count">3</span> min</h3>
  </section>

  <!-- 04 — THE RIDE: city drive (15.8 - 21.0s) -->
  <section class="scene" id="s4">
    <div class="city-wrap">
      <svg class="city-layer city-far" viewBox="0 0 400 120" preserveAspectRatio="none">
        <g fill="#0c0c0c" id="far-buildings">
          <rect x="0" y="40" width="46" height="80"/><rect x="54" y="20" width="36" height="100"/>
          <rect x="96" y="55" width="30" height="65"/><rect x="132" y="10" width="40" height="110"/>
          <rect x="178" y="45" width="32" height="75"/><rect x="216" y="60" width="44" height="60"/>
          <rect x="266" y="25" width="36" height="95"/><rect x="308" y="48" width="30" height="72"/>
          <rect x="344" y="30" width="40" height="90"/>
          <rect x="400" y="40" width="46" height="80"/><rect x="454" y="20" width="36" height="100"/>
        </g>
      </svg>
      <svg class="city-layer city-near" viewBox="0 0 400 140" preserveAspectRatio="none">
        <g fill="#161616" id="near-buildings">
          <rect x="0" y="60" width="60" height="80"/><rect x="68" y="30" width="46" height="110"/>
          <rect x="122" y="75" width="40" height="65"/><rect x="170" y="15" width="54" height="125"/>
          <rect x="232" y="55" width="42" height="85"/><rect x="282" y="78" width="58" height="62"/>
          <rect x="400" y="60" width="60" height="80"/><rect x="468" y="30" width="46" height="110"/>
        </g>
      </svg>
      <div class="road"></div>
      <svg class="icon-car-ride" viewBox="0 0 110 50">
        <ellipse cx="55" cy="46" rx="40" ry="4" fill="rgba(0,0,0,0.5)"/>
        <path d="M8 34 L18 12 Q25 2 38 2 L72 2 Q85 2 92 12 L102 34 Z" fill="var(--accent)"/>
        <rect x="34" y="6" width="42" height="16" rx="5" fill="#0a0a0a"/>
        <circle cx="30" cy="38" r="10" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
        <circle cx="80" cy="38" r="10" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>
    <p class="line-caption">Every turn, tracked.<br/>Every driver, rated.</p>
  </section>

  <!-- 05 — ARRIVAL: safe + upfront price (21.0 - 25.4s) -->
  <section class="scene" id="s5">
    <svg class="icon-check" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="3"/>
      <circle id="check-ring" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="3"
        stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)"/>
      <path id="check-path" d="M36 62 L52 78 L86 42" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80"/>
    </svg>
    <p class="eyebrow">You've arrived safely</p>
    <div class="receipt">
      <div class="receipt-row"><span>Upfront fare</span><strong>$14.20</strong></div>
      <div class="receipt-row"><span>Rate your driver</span><strong class="stars-inline">★★★★★</strong></div>
    </div>
  </section>

  <!-- 06 — BRAND CLOSE (25.4 - 30.0s) -->
  <section class="scene" id="s6">
    <h1 class="closer-line">Your day,<br/><span class="accent-text">your way.</span></h1>
    <div class="cta-row">
      <span class="cta-wordmark">Uber</span>
      <button class="cta-btn">Get the app</button>
    </div>
    <div class="confetti" id="confetti"></div>
  </section>

  <!-- seamless wipe transition layer -->
  <div class="wiper" id="wiper"></div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <button id="replay-btn" aria-label="Replay">↻ Replay</button>
</main>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/CustomEase.min.js"></script>
<script src="script.js"></script>
</body>
</html>
